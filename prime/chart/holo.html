<script>
/* DM gate. Inline, as on the chart: this page carries its own styles and
   does not load dm-nav.js. Mirrors the guard in scripts/dm-nav.js. */
(function () {
  var pn = window.location.pathname;
  var i = pn.indexOf('/prime/');
  if (i === -1) return;
  var authed = false;
  try { authed = sessionStorage.getItem('caelestis_continuum_auth') === '1'; } catch (err) { authed = false; }
  if (authed) return;
  var depth = (pn.slice(i + 7).match(/\//g) || []).length;
  window.location.replace((depth > 0 ? new Array(depth + 1).join('../') : './') + 'index.html');
})();
</script>
<title>Erevos Galaxy · Holochart · Caelestis DM</title>
<style>
:root{
  --bg:#03070d; --holo:#7fe9f0; --holo-d:rgba(127,233,240,.55); --holo-f:rgba(127,233,240,.16);
  --gold:#f0b979; --red:#ff6b6b; --text:#d8f6f8; --muted:#7fa6ad;
  --serif:"Crimson Pro",Georgia,"Times New Roman",serif; --display:"Cinzel","Trajan Pro",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--serif);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
/* Hologram treatment: scanlines, vignette, a faint flicker. */
.scan{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(to bottom,rgba(127,233,240,.035) 0 1px,transparent 1px 3px);
  mix-blend-mode:screen;animation:flick 6s infinite steps(1)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
@keyframes flick{0%,100%{opacity:1}47%{opacity:.85}48%{opacity:1}73%{opacity:.92}74%{opacity:1}}
@media (prefers-reduced-motion: reduce){.scan{animation:none}}

header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;
  padding:.7rem 1rem;background:linear-gradient(to bottom,rgba(3,7,13,.92),rgba(3,7,13,0));pointer-events:none}
header > *{pointer-events:auto}
.back{font-family:var(--display);font-size:.7rem;letter-spacing:.18em;color:var(--muted);text-decoration:none}
.back:hover{color:var(--holo)}
h1{margin:0;font-family:var(--display);font-weight:600;font-size:1.1rem;letter-spacing:.12em;color:var(--holo);
  text-shadow:0 0 12px rgba(127,233,240,.55)}
.ctl{display:flex;flex-wrap:wrap;gap:.4rem;margin-left:auto;align-items:center}
.ctl button,.ctl select{font:inherit;font-size:.85rem;color:var(--text);background:rgba(10,30,38,.7);
  border:1px solid var(--holo-f);border-radius:4px;padding:.3rem .6rem;cursor:pointer}
.ctl button[aria-pressed="true"]{border-color:var(--holo-d);color:var(--holo);box-shadow:0 0 10px rgba(127,233,240,.25) inset}
.ctl button:hover,.ctl select:hover{border-color:var(--holo-d)}
.ctl .go{border-color:rgba(240,185,121,.6);color:var(--gold)}

#panel{position:fixed;right:1rem;top:4.2rem;z-index:5;width:min(340px,calc(100vw - 2rem));max-height:calc(100vh - 6rem);overflow:auto;
  background:rgba(4,16,22,.82);border:1px solid var(--holo-f);border-top:2px solid var(--holo-d);border-radius:6px;
  padding:.9rem 1rem;backdrop-filter:blur(6px);font-size:.95rem;line-height:1.5}
#panel[hidden]{display:none}
#panel h2{margin:0 0 .15rem;font-family:var(--display);font-size:1rem;letter-spacing:.08em;color:var(--holo)}
#panel .kind{margin:0 0 .6rem;color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
#panel p{margin:.4rem 0}
#panel ul{margin:.4rem 0;padding-left:1.1rem}
#panel a{color:var(--holo)}
#panel .dm{margin-top:.7rem;padding:.5rem .7rem;border-left:2px solid var(--gold);background:rgba(240,185,121,.06)}
#panel .dm b{display:block;font-family:var(--display);font-size:.7rem;letter-spacing:.14em;color:var(--gold);font-weight:600}
#panel .x{float:right;background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer}

#caption{position:fixed;left:50%;bottom:4.2rem;transform:translateX(-50%);z-index:4;pointer-events:none;
  font-family:var(--display);letter-spacing:.2em;font-size:clamp(.8rem,2.2vw,1.1rem);color:var(--gold);
  text-shadow:0 0 14px rgba(240,185,121,.6);opacity:0;transition:opacity 1.2s}
#caption.on{opacity:1}
footer{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;align-items:center;
  padding:.55rem 1rem;font-size:.8rem;color:var(--muted);background:linear-gradient(to top,rgba(3,7,13,.92),rgba(3,7,13,0))}
footer i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.35rem;vertical-align:middle}
.lbl{font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--holo);white-space:nowrap;
  text-shadow:0 0 6px rgba(127,233,240,.7);transform:translateY(-14px);pointer-events:none}
.lbl.sm{font-size:9px;opacity:.75}
.lbl.gold{color:var(--gold);text-shadow:0 0 6px rgba(240,185,121,.7)}
.lbl.below{transform:translateY(14px)}
.lbl.heart{font-family:var(--serif);font-style:italic;font-size:11px;letter-spacing:0;color:#ffd0d0}
.hide-labels .lbl{display:none}
#fail{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:2rem;z-index:9;color:var(--muted)}
@media (max-width:640px){
  header{padding:.5rem .6rem}
  .ctl{margin-left:0}
  .ctl button,.ctl select{font-size:.78rem;padding:.25rem .45rem}
  #panel{top:auto;bottom:3.2rem;right:.5rem;left:.5rem;width:auto;max-height:42vh}
  footer{font-size:.72rem}
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ════════════════════════════════════════════════════════════════
   The Erevos Galaxy in three dimensions.

   Geometry follows the flat chart (prime/chart/index.html): the same
   spiral formula, the same system positions, mapped onto a disc. The
   chart's x and y become this page's x and z, scaled so the galaxy's
   radius is 100 units; y is height above the disc.

   The inscription. Vecna chose the fifteen heart worlds for how they look
   from Oerth. Each point of the eye (ten on the lids, five in the iris)
   is set along the line of sight from Oerth through that point, at a
   seeded distance. From Oerth, looking at the core, the hearts and their
   links fold into the eye with the core as its pupil; from anywhere else
   they scatter. The seed fixes the positions, so they are the same on
   every visit.
   ════════════════════════════════════════════════════════════════ */

// ── Shared with the flat chart ─────────────────────────────────────
const GX = { cx:2200, cy:1900, R:1650 };
function rng(seed){ let a = seed>>>0; return () => { a = (a + 0x6D2B79F5)>>>0; let t = a; t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14))>>>0)/4294967296; }; }
function gauss(r){ let u = 0, v = 0; while(!u) u = r(); while(!v) v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function armPt(arm, t, jr, ja, spin){
  const ang = t*1.55 + arm*Math.PI + 0.35 + (ja||0) + (spin||0), r = GX.R*(0.09 + t/3.6) + (jr||0);
  return [GX.cx + r*Math.cos(ang), GX.cy + r*Math.sin(ang)*0.9];
}
const RS = armPt(0, 2.1);
const OUT = (() => { const dx = RS[0]-GX.cx, dy = RS[1]-GX.cy, l = Math.hypot(dx,dy); return [dx/l, dy/l]; })();
const TAN = [-OUT[1], OUT[0]];
const at = (base, o, t) => [base[0] + OUT[0]*o + TAN[0]*t, base[1] + OUT[1]*o + TAN[1]*t];

const S = 100 / GX.R;                       // chart units → scene units
const toV = (p, y=0) => new THREE.Vector3((p[0]-GX.cx)*S, y, (p[1]-GX.cy)*S);
const LOC = '../locations/';

// ── What is charted ────────────────────────────────────────────────
const SYSTEMS = [
  { id:'realmspace', name:'Realmspace', pos:RS, page:'realmspace.html', kind:'Star system',
    summary:'Caelestis\'s home system: a yellow sun, five inner worlds and three outer ones. Toril, Caelestis and H\'Catha are here.' },
  { id:'virenspace', name:'Virenspace', des:'CSC 69387', pos:at(RS,-40,760), page:'virenspace.html', kind:'Star system',
    summary:'Reached by the charted lane through the Astral waystation, then a long haul.' },
  { id:'aethris', name:'CSC 56973', pos:at(RS,-120,-720), page:'aethris.html', kind:'Star system',
    summary:'Aethris\'s system, where the Prism Ascendant stands. A long haul from Realmspace past the carved-meteor hub.' },
  { id:'krynnspace', name:'Krynnspace', des:'CSC 16423', pos:armPt(0,1.2,30), page:'krynnspace.html', kind:'Star system',
    summary:'Krynn and Fonains. An uncharted route from Realmspace, far beyond the watch at Realmspace\'s edge.' },
  { id:'greyspace', name:'Greyspace', pos:armPt(1,2.7,-20), page:'oerth.html#greyspace', kind:'Star system',
    summary:'Far across the galaxy, on the opposite arm from Realmspace. No lane on Caelestis\'s charts reaches it. Oerth is here.' },
  { id:'wayfinders', name:'The Wayfinders\' homeworld', pos:[3250,950], page:'wayfinders-homeworld.html', kind:'Hidden system',
    summary:'Hidden by a living ritual. Wayfinders leave with no map and no name, and must re-recognize home.', dm:'Its position here is symbolic.' }
];
const sysPos = id => SYSTEMS.find(s => s.id === id).pos;

const SITES = (() => {
  const toK = (() => { const k = sysPos('krynnspace'), dx = k[0]-RS[0], dy = k[1]-RS[1], l = Math.hypot(dx,dy); return [dx/l, dy/l]; })();
  const mid = (() => { const x = OUT[0]+toK[0], y = OUT[1]+toK[1], l = Math.hypot(x,y); return [x/l, y/l]; })();
  const strake = at(RS, 600, 0), hollis = at(RS, -600, 0), cairn = [RS[0]+mid[0]*1150, RS[1]+mid[1]*1150];
  const lerp = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  return [
    { id:'waystation', name:'Astral waystation', pos:lerp(RS, sysPos('virenspace'), .55), page:'waystation.html', kind:'Stop on a lane', summary:'The last reliable resupply before the long haul to Virenspace.' },
    { id:'meteorhub', name:'Carved-meteor hub', pos:lerp(RS, sysPos('aethris'), .5), page:'meteor-hub.html', kind:'Stop on a lane', summary:'A hollowed meteor turned into a gathering place.' },
    { id:'strake', name:'Strake Station', pos:strake, page:'strake-station.html', kind:'Fleet station', summary:'The last open deck on the run to Cairn.' },
    { id:'hollis', name:'Hollis Post', pos:hollis, page:'realmspace.html#hollis-post', kind:'Fleet satellite', summary:'The western satellite of the watch at Realmspace\'s edge.' },
    { id:'cairn', name:'Cairn Station', pos:cairn, page:'cairn-station.html', kind:'Fleet satellite', summary:'Silent for a year. Closed by standing order SA-005.', dm:'Vth\'oramu sat on the bearing; Vocath\'s crew took the station afterward.' }
  ];
})();
const placePos = id => (SYSTEMS.find(s => s.id === id) || SITES.find(s => s.id === id)).pos;

const LANES = [
  { a:'realmspace', b:'virenspace', tier:'charted' },
  { a:'realmspace', b:'aethris', tier:'long' },
  { a:'aethris', b:'virenspace', tier:'long' },
  { a:'realmspace', b:'krynnspace', tier:'uncharted' },
  { a:'realmspace', b:'strake', tier:'charted' },
  { a:'realmspace', b:'hollis', tier:'charted' },
  { a:'strake', b:'cairn', tier:'closed' }
];
const LANE_STYLE = {
  charted:{ c:0x8fe8df, dash:0, op:.85 }, long:{ c:0x8fe8df, dash:3, gap:1.8, op:.6 },
  uncharted:{ c:0x8fe8df, dash:.6, gap:1.8, op:.7 }, closed:{ c:0xff6b6b, dash:0, op:.75 }
};

// ── The scene ──────────────────────────────────────────────────────
const stage = document.getElementById('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false }); }
catch (e) { document.getElementById('fail').style.display = 'grid'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x03070d);
stage.appendChild(renderer.domElement);

const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position:'absolute', top:'0', left:'0', pointerEvents:'none' });
stage.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03070d, 0.0022);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 3000);
const HOME_POS = new THREE.Vector3(0, 120, 175);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 520;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;

const galaxy = new THREE.Group();              // everything that turns together
scene.add(galaxy);

// Soft round sprite for points.
function dotTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32,32,0,32,32,32);
  grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(.25,'rgba(255,255,255,.75)');
  grd.addColorStop(.6,'rgba(255,255,255,.12)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const DOT = dotTexture();

// Stars: two arms, a bulge and a thin halo, in hologram tones.
(function stars(){
  const R = rng(9113), pos = [], col = [];
  const tones = [new THREE.Color(0x7fe9f0), new THREE.Color(0x5fc8e8), new THREE.Color(0xbff6ff), new THREE.Color(0x8fa8ff)];
  const push = (x,y,z,b) => { pos.push(x,y,z); const t = tones[Math.floor(R()*tones.length)].clone().multiplyScalar(b); col.push(t.r,t.g,t.b); };
  for (let i = 0; i < 26000; i++) {
    const arm = R() < .5 ? 0 : 1, t = Math.pow(R(), .85) * 3.3;
    const p = armPt(arm, t, gauss(R)*90*(.4+t/3), gauss(R)*.16);
    const v = toV(p); const thick = 2.2 + 3.5*Math.exp(-t*1.2);
    push(v.x, gauss(R)*thick, v.z, .45 + R()*.6);
  }
  for (let i = 0; i < 7000; i++) {             // bulge
    const r = Math.abs(gauss(R))*11, a = R()*Math.PI*2;
    push(Math.cos(a)*r, gauss(R)*4.5*Math.exp(-r/14), Math.sin(a)*r*.9, .7 + R()*.5);
  }
  for (let i = 0; i < 3500; i++) {             // halo
    const r = 15 + R()*95, a = R()*Math.PI*2;
    push(Math.cos(a)*r, gauss(R)*14, Math.sin(a)*r*.9, .2 + R()*.35);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  // Fixed pixel size: stars stay pinpoints however close the camera comes.
  const m = new THREE.PointsMaterial({ size:2.2*Math.min(window.devicePixelRatio,2), map:DOT, vertexColors:true, transparent:true, opacity:.9,
    depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:false });
  starMat = m;
  galaxy.add(new THREE.Points(g, m));
})();
var starMat;

// Projection grid: rings and spokes on the disc, as a holotable shows it.
(function grid(){
  const m = new THREE.LineBasicMaterial({ color:0x7fe9f0, transparent:true, opacity:.08, depthWrite:false });
  for (let r = 20; r <= 120; r += 20) {
    const pts = []; for (let i = 0; i <= 128; i++) { const a = i/128*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r, -0.2, Math.sin(a)*r)); }
    galaxy.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), m));
  }
  for (let k = 0; k < 12; k++) {
    const a = k/12*Math.PI*2;
    galaxy.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-0.2,0), new THREE.Vector3(Math.cos(a)*120,-0.2,Math.sin(a)*120)]), m));
  }
})();

// Picking and labels.
const pickables = [], markers = [];
const _w = new THREE.Vector3();
function label(text, obj, cls='lbl'){
  const d = document.createElement('div'); d.className = cls; d.textContent = text;
  const o = new CSS2DObject(d); obj.add(o); return o;
}
function glowSprite(color, size, opacity=1){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:DOT, color, transparent:true, opacity, depthWrite:false, blending:THREE.AdditiveBlending }));
  s.scale.set(size, size, 1); return s;
}
function node(color, r, info, shape='sphere'){
  const geo = shape === 'oct' ? new THREE.OctahedronGeometry(r) : new THREE.IcosahedronGeometry(r, 1);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent:true, opacity:.95 }));
  mesh.add(glowSprite(color, r*7, .55));
  mesh.userData.info = info; pickables.push(mesh); markers.push(mesh); return mesh;
}

// The core: Erevos.
const core = new THREE.Group();
core.add(new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 16), new THREE.MeshBasicMaterial({ color:0x000000 })));
const coreGlow = glowSprite(0xf0b979, 22, .9); core.add(coreGlow);
const coreRing = new THREE.Mesh(new THREE.RingGeometry(2.4, 2.9, 64), new THREE.MeshBasicMaterial({ color:0xf0b979, side:THREE.DoubleSide, transparent:true, opacity:.7 }));
coreRing.rotation.x = Math.PI/2; core.add(coreRing);
const coreHit = new THREE.Mesh(new THREE.SphereGeometry(3, 12, 8), new THREE.MeshBasicMaterial({ visible:false }));
coreHit.userData.info = { name:'Erevos', kind:'The galaxy\'s core', page:'../glossary/#erevos',
  summary:'The black hole at the centre of the Erevos Galaxy. Its core is asleep.',
  dm:'The pupil of the eye. When lids and iris are whole, the eye opens and the core wakes; what lands on Oerth is sight.' };
pickables.push(coreHit); core.add(coreHit);
label('Erevos', core, 'lbl gold');
galaxy.add(core);

// Systems and sites.
const viewSel = document.getElementById('view');
SYSTEMS.forEach(s => {
  const n = node(s.id === 'greyspace' ? 0xf0b979 : 0x7fe9f0, s.id === 'wayfinders' ? .7 : 1.05, s);
  n.position.copy(toV(s.pos, s.id === 'wayfinders' ? 3 : 0.4));
  s.v = n.position.clone();
  label(s.name, n, s.id === 'greyspace' ? 'lbl gold' : 'lbl');
  galaxy.add(n);
  if (s.id !== 'wayfinders') viewSel.insertAdjacentHTML('beforeend', `<option value="${s.id}">From ${s.name}</option>`);
});
SITES.forEach(s => {
  const n = node(0x9fd8e0, .45, s, 'oct');
  n.position.copy(toV(s.pos, 0.3)); s.v = n.position.clone();
  label(s.name, n, 'lbl sm'); galaxy.add(n);
});

// Lanes.
const lanes = new THREE.Group(); galaxy.add(lanes);
LANES.forEach(l => {
  const st = LANE_STYLE[l.tier], a = toV(placePos(l.a), .35), b = toV(placePos(l.b), .35);
  const mid = a.clone().add(b).multiplyScalar(.5); mid.y += a.distanceTo(b)*.06;
  const pts = new THREE.QuadraticBezierCurve3(a, mid, b).getPoints(40);
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = st.dash ? new THREE.LineDashedMaterial({ color:st.c, dashSize:st.dash, gapSize:st.gap, transparent:true, opacity:st.op })
                    : new THREE.LineBasicMaterial({ color:st.c, transparent:true, opacity:st.op });
  const line = new THREE.Line(g, m); if (st.dash) line.computeLineDistances(); lanes.add(line);
});

// ── The inscription ────────────────────────────────────────────────
const OERTH = toV(sysPos('greyspace'), 0.4);
const CORE = new THREE.Vector3(0, 0, 0);
const F = CORE.clone().sub(OERTH).normalize();                       // Oerth's line of sight
const Rt = new THREE.Vector3().crossVectors(F, new THREE.Vector3(0,1,0)).normalize();
const Up = new THREE.Vector3().crossVectors(Rt, F).normalize();
const HALF = 0.43;                                                  // the eye's half-width, as a tangent
const D = OERTH.distanceTo(CORE);

// The eye in Oerth's view, matching the flat chart's figure: lid width 1,
// lid height .373, iris radius .24. Upper lid five points (the third holds
// two linked hearts in one system), lower lid four, iris five.
const EYE2D = [];
[-1,-.5,0,.5,1].forEach(u => EYE2D.push({ part:'upper', x:u, y:.373*(1-u*u) }));
[.6,.2,-.2,-.6].forEach(u => EYE2D.push({ part:'lower', x:u, y:-.373*(1-u*u) }));
for (let k = 0; k < 5; k++) EYE2D.push({ part:'iris', x:.24*Math.cos(2*Math.PI*k/5 - Math.PI/2)*-1, y:.24*Math.sin(-2*Math.PI*k/5 + Math.PI/2) });

const HR = rng(4127);
const HEARTS = EYE2D.map((e, i) => {
  const dir = F.clone().addScaledVector(Rt, e.x*HALF).addScaledVector(Up, e.y*HALF).normalize();
  let p, tries = 0;
  do {                                   // a seeded depth along the line of sight, inside the galaxy
    const t = D*(.28 + HR()*1.3);
    p = OERTH.clone().addScaledVector(dir, t); tries++;
  } while (tries < 200 && (Math.hypot(p.x, p.z) > 104 || Math.hypot(p.x, p.z) < 12 || p.distanceTo(OERTH) < 14
          || SYSTEMS.some(s => p.distanceTo(s.v) < 9)));
  const n = i + 1;
  return { i, n, part:e.part, v:p, pair: i === 2, state: i === 2 ? 'linked' : i === 6 ? 'found' : 'unknown',
           label: i === 2 ? '3–4' : String(n + (n > 3 ? 1 : 0)) };
});
const HSTATE = { linked:{ c:0x8fe8df, word:'Opened and linked' }, found:{ c:0xf0b979, word:'Found, not opened' }, unknown:{ c:0x6d7f86, word:'Not yet known' } };

const ins = new THREE.Group(); galaxy.add(ins);
HEARTS.forEach(h => {
  const st = HSTATE[h.state];
  const info = {
    name: h.pair ? 'Two heart worlds' : h.state === 'found' ? 'Nowhere' : 'Heart world',
    kind: `Inscription · ${h.part === 'iris' ? 'Iris' : h.part === 'upper' ? 'Upper lid' : 'Lower lid'} · ${h.label}`,
    summary: h.pair ? 'Two worlds in one system, opened and linked to each other, and each linked to Oerth.'
           : h.state === 'found' ? 'A lesser god forced its way into this system and down onto the world, and the push destroyed both. A Monolith answered. The world\'s heart lies exposed in the wreck.'
           : 'A heart world in the figure. Which world it is has not been chosen.',
    dm: (h.part === 'iris' ? 'An iris world: key. Lose one and the iris must be redrawn. ' : 'A lid world: replaceable, at a cost of years. ') + 'Like every heart in the figure, it links back to Oerth\'s heart.',
    page: h.state === 'found' ? 'nowhere.html' : '../opposition/vecna.html'
  };
  const n = node(st.c, h.part === 'iris' ? .8 : .7, info);
  n.position.copy(h.v);
  if (h.part === 'iris') {
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.25, 1.45, 32), new THREE.MeshBasicMaterial({ color:0xff6b6b, side:THREE.DoubleSide, transparent:true, opacity:.85 }));
    n.add(ring); n.userData.ring = ring;
  }
  if (h.pair) { const twin = new THREE.Mesh(new THREE.IcosahedronGeometry(.45, 1), new THREE.MeshBasicMaterial({ color:st.c })); twin.position.set(1.3, .3, 0); n.add(twin); }
  label(h.label, n, 'lbl heart');
  ins.add(n); h.mesh = n;
});

// Oerth, the retina.
const oerthNode = node(0xf0b979, 1.3, { name:'Oerth', kind:'Greyspace · the eye\'s retina', page:'oerth.html',
  summary:'Oerth, in Greyspace, where Vecna became a god.', dm:'Oerth\'s heart has been Vecna\'s since his ascension. Every heart in the inscription links back to it. From here, and only from here, the hearts line up into the eye he lost.' });
oerthNode.position.copy(OERTH).add(new THREE.Vector3(0, 1.6, 0));
label('Oerth', oerthNode, 'lbl gold below'); galaxy.add(oerthNode);

// Links: around each lid, around the iris, and every heart back to Oerth.
function loop(ids, color, dash, closed){
  const pts = ids.map(i => HEARTS[i].v); if (closed) pts.push(HEARTS[ids[0]].v);
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = new THREE.LineDashedMaterial({ color, dashSize:dash, gapSize:dash*.7, transparent:true, opacity:.7 });
  const l = new THREE.Line(g, m); l.computeLineDistances(); return l;
}
const LID = [0,1,2,3,4,5,6,7,8], IRIS = [9,10,11,12,13];
const eyeLines = new THREE.Group(); ins.add(eyeLines);
eyeLines.add(loop(LID, 0xf0b979, 1.4, true));
eyeLines.add(loop(IRIS, 0xc9b3ea, 1.0, true));
const cone = new THREE.Group(); ins.add(cone);
HEARTS.forEach(h => {
  const g = new THREE.BufferGeometry().setFromPoints([h.v, OERTH]);
  const l = new THREE.Line(g, new THREE.LineDashedMaterial({ color:0xc9b3ea, dashSize:.5, gapSize:1.4, transparent:true, opacity:.3 }));
  l.computeLineDistances(); cone.add(l);
});
cone.visible = false;

// ── Viewpoints and the reveal ──────────────────────────────────────
const caption = document.getElementById('caption');
let tween = null, atOerth = false;
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;

function flyTo(pos, target, fov, ms, done){
  galaxy.rotation.y = 0;                                     // views are set in galaxy space
  tween = { t0: performance.now(), ms, p0: camera.position.clone(), p1: pos.clone(),
            g0: controls.target.clone(), g1: target.clone(), f0: camera.fov, f1: fov, done };
  controls.enabled = false;
}
function eyeFov(){
  // Fit the eye's width, with a margin, to the screen.
  const hHalf = Math.atan(HALF*1.25), vHalf = Math.atan(Math.tan(hHalf)/camera.aspect);
  return Math.max(30, Math.min(105, THREE.MathUtils.radToDeg(vHalf*2)));
}
function standAt(id){
  stopSpin();
  caption.classList.remove('on'); atOerth = false;
  if (id === 'free') { flyTo(HOME_POS, CORE, 50, 1800); return; }
  const s = SYSTEMS.find(x => x.id === id);
  const p = s.v.clone().addScaledVector(F.clone().copy(CORE).sub(s.v).normalize(), -0.01);
  if (id === 'greyspace') { revealFromOerth(); return; }
  flyTo(p.add(new THREE.Vector3(0, .6, 0)), CORE, eyeFov(), 2200);
}
function revealFromOerth(){
  stopSpin(); setPressed('tIns', true); ins.visible = true;
  viewSel.value = 'greyspace';
  flyTo(OERTH.clone(), CORE, eyeFov(), 2600, () => {
    atOerth = true; caption.classList.add('on');
    revealPulse = performance.now();
  });
}
let revealPulse = 0;
function stopSpin(){ controls.autoRotate = false; setPressed('tSpin', false); }

// ── Controls ───────────────────────────────────────────────────────
function setPressed(id, on){ document.getElementById(id).setAttribute('aria-pressed', on ? 'true' : 'false'); }
function toggle(id, fn){
  const b = document.getElementById(id);
  b.addEventListener('click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; setPressed(id, on); fn(on); });
}
toggle('tIns', on => { ins.visible = on; if (!on) caption.classList.remove('on'); });
toggle('tCone', on => { cone.visible = on; });
toggle('tLanes', on => { lanes.visible = on; });
toggle('tLabels', on => { document.body.classList.toggle('hide-labels', !on); });
toggle('tSpin', on => { controls.autoRotate = on; });
document.getElementById('goOerth').addEventListener('click', revealFromOerth);
viewSel.addEventListener('change', () => standAt(viewSel.value));
controls.addEventListener('start', () => {
  if (controls.autoRotate) stopSpin();
  if (atOerth) { atOerth = false; caption.classList.remove('on'); }
});

// Panel.
const panel = document.getElementById('panel');
function showInfo(info){
  const href = info.page ? (info.page.startsWith('../') ? info.page : LOC + info.page) : '';
  panel.innerHTML = `<button class="x" type="button" aria-label="Close">&times;</button>
    <h2>${info.name}</h2><p class="kind">${info.kind || ''}${info.des ? ' · ' + info.des : ''}</p>
    <p>${info.summary || ''}</p>
    ${info.dm ? `<div class="dm"><b>DM</b>${info.dm}</div>` : ''}
    ${href ? `<p><a href="${href}">Open the entry &rarr;</a></p>` : ''}`;
  panel.hidden = false;
  panel.querySelector('.x').addEventListener('click', () => { panel.hidden = true; });
}
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  ptr.set(e.clientX/innerWidth*2 - 1, -(e.clientY/innerHeight)*2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables.filter(m => m.visible && (ins.visible || !ins.children.includes(m))), false)[0];
  if (hit) showInfo(hit.object.userData.info);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  if (atOerth) camera.fov = eyeFov();
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});

// ── Frame loop ─────────────────────────────────────────────────────
const clock = new THREE.Clock();
function frame(now){
  const dt = clock.getDelta();
  if (tween) {
    const k = Math.min(1, (now - tween.t0)/tween.ms), e = ease(k);
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.g0, tween.g1, e);
    camera.fov = tween.f0 + (tween.f1 - tween.f0)*e; camera.updateProjectionMatrix();
    camera.lookAt(controls.target);
    if (k >= 1) { const d = tween.done; tween = null; controls.enabled = true; controls.update(); if (d) d(); }
  } else {
    controls.update();
  }
  // Markers keep a steady size on screen, near or far.
  markers.forEach(m => { m.getWorldPosition(_w); const k = THREE.MathUtils.clamp(camera.position.distanceTo(_w)/70, .25, 3.2); m.scale.setScalar(k); });
  // Hologram life: the core breathes, the iris rings face the viewer.
  const s = 1 + Math.sin(now*.0018)*.08; coreGlow.scale.set(22*s, 22*s, 1);
  coreRing.rotation.z += dt*.2;
  HEARTS.forEach(h => { if (h.mesh.userData.ring) h.mesh.userData.ring.lookAt(camera.position); });
  if (starMat) starMat.opacity = .85 + Math.sin(now*.004)*.03 + (Math.random() < .01 ? -.12 : 0);
  // The reveal: the eye's lines brighten, then settle.
  const r = revealPulse ? Math.max(0, 1 - (now - revealPulse)/3500) : 0;
  eyeLines.children.forEach(l => { l.material.opacity = atOerth ? .75 + .25*Math.sin(Math.min(1, r)*Math.PI) : .7; });
  coreGlow.material.opacity = .9 + r*.1; if (r > 0) coreGlow.scale.multiplyScalar(1 + r*.6);
  renderer.render(scene, camera); labels.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// A hash opens on a viewpoint: holo.html#oerth plays the reveal.
if (location.hash === '#oerth') setTimeout(revealFromOerth, 400);
</script>
</body>
</html>
