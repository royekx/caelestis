<style>
/* The Chart: one DM page with two views, the flat chart (2D) and the
   holochart (3D, holo.html in a frame, loaded when first opened). The page
   fills the content area under the nav. Everything is scoped to
   .chart-shell and its tokens carry a ch- prefix, so nothing here reaches
   the DM nav or the shared sheets. */
html { overflow-x: clip; }
.chart-shell {
  --ch-map:#070a12; --ch-panel:rgba(14,19,31,.92); --ch-raised:rgba(28,36,52,.9); --ch-rule:rgba(196,212,232,.14);
  --ch-text:#dfe6f0; --ch-soft:#c6d2e2; --ch-muted:#8c9cb2;
  --ch-gold:#D4A256; --ch-gold-l:#e2ae7e; --ch-ice:#6f9ec9; --ch-ice-l:#9cc0e0; --ch-violet:#9683c4; --ch-violet-l:#b6a6dc; --ch-red:#b04a4a;
  --ch-teal:#56B4A6; --ch-accent:var(--accent, #6E95D4);
  --serif:"Crimson Pro",Georgia,"Times New Roman",serif; --display:"Cinzel","Trajan Pro",Georgia,serif;
  position:relative; z-index:1; box-sizing:border-box;
  display:flex; flex-direction:column; gap:.55rem;
  height:100vh; height:100dvh; padding:.75rem clamp(.75rem,1.6vw,1.4rem);
  color:var(--ch-text); font-family:var(--serif); font-size:17px; line-height:1.5;
}
.chart-shell *, .chart-shell *::before, .chart-shell *::after { box-sizing:border-box; }
.chart-shell [hidden] { display:none !important; }

/* Title row: name, the view switch, the clock */
.chart-head { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem 1.1rem; min-width:0; }
.chart-title { display:flex; align-items:baseline; gap:.7rem; }
.chart-eyebrow { font-family:var(--display); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ch-accent); }
.chart-head h1 { margin:0; font-family:var(--display); font-weight:600; font-size:22px; letter-spacing:.1em; color:#e6eef8; }
.view-switch { display:inline-flex; border:1px solid var(--ch-rule); border-radius:4px; overflow:hidden; background:rgba(9,12,20,.6); }
.view-switch button { font-family:var(--display); font-size:12px; letter-spacing:.14em; text-transform:uppercase; min-height:38px; padding:0 1rem;
  background:transparent; color:var(--ch-muted); border:0; cursor:pointer; }
.view-switch button + button { border-left:1px solid var(--ch-rule); }
.view-switch button[aria-selected="true"] { background:rgba(110,149,212,.16); color:#e6eef8; box-shadow:inset 0 -2px 0 var(--ch-accent); }
.view-switch button:focus-visible { outline:2px solid var(--ch-accent); outline-offset:-2px; }
.gtc-host { flex:1 1 560px; min-width:0; }

.view { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:.55rem; }

/* 2D toolbar */
.toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.45rem .7rem; }
.crumbs { flex:1 1 14rem; min-width:0; color:var(--ch-muted); font-size:16px; }
.crumbs button { font:inherit; color:var(--ch-ice-l); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.chart-shell .btn { font-family:var(--serif); font-size:15px; color:var(--ch-text); background:var(--ch-raised); border:1px solid var(--ch-rule); border-radius:4px;
  padding:.3rem .7rem; cursor:pointer; min-height:36px; }
.chart-shell .btn[aria-pressed="true"] { border-color:var(--ch-accent); box-shadow:inset 0 0 0 1px var(--ch-accent); }
.chart-shell .btn.go { border-color:rgba(212,162,86,.6); color:var(--ch-gold-l); }
.chart-shell .btn:focus-visible, .chart-shell .node:focus-visible, .chart-shell .chip:focus-visible { outline:2px solid var(--ch-gold-l); outline-offset:3px; }

.layout { flex:1 1 auto; min-height:0; display:grid; gap:.8rem; }
@media (min-width:980px) { .layout { grid-template-columns:minmax(0,1fr) 360px; } }
.chart { position:relative; display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--ch-map); border:1px solid var(--ch-rule); border-radius:6px; overflow:hidden; }
#map { display:block; width:100%; flex:1 1 auto; min-height:0; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
#map.dragging { cursor:grabbing; }
.zoom { position:absolute; top:.6rem; right:.6rem; display:flex; flex-direction:column; gap:.35rem; }
.zoom .btn { background:rgba(20,28,43,.9); min-width:42px; min-height:42px; font-size:19px; padding:0 .6rem; }
.zoom .btn.fit { font-size:14px; }
.legend { display:flex; flex-wrap:wrap; gap:.3rem 1.1rem; padding:.5rem .9rem; border-top:1px solid var(--ch-rule); font-size:14px; color:#b3c1d5; background:#0b1019; }
.legend span { display:inline-flex; align-items:center; gap:.45rem; }
.legend svg { width:34px; height:12px; }

.side { min-height:0; min-width:0; display:flex; flex-direction:column; gap:.8rem; overflow:auto; }
.panel { background:var(--ch-panel); border:1px solid var(--ch-rule); border-radius:6px; padding:1rem 1.1rem 1.2rem; }
.panel h2 { font-family:var(--display); font-weight:600; font-size:20px; letter-spacing:.04em; margin:.1rem 0 .35rem; color:#e6eef8; border:0; padding:0; }
.panel .kind { color:var(--ch-muted); font-size:16px; margin:0 0 .6rem; }
.badge { display:inline-block; font-size:14px; border-radius:3px; padding:.05rem .5rem; margin:0 .35rem .35rem 0; border:1px solid var(--ch-rule); }
.b-canon { color:var(--ch-ice-l); border-color:var(--ch-ice); }
.b-gold { color:var(--ch-gold-l); border-color:var(--ch-gold); }
.b-red { color:#e08a8a; border-color:var(--ch-red); }
.b-teal { color:#8fd4c8; border-color:var(--ch-teal); }
.b-hidden { color:var(--ch-violet-l); border-color:var(--ch-violet); }
.panel h3 { font-weight:500; font-size:16px; color:var(--ch-gold-l); margin:1rem 0 .25rem; font-family:var(--serif); letter-spacing:0; text-transform:none; }
.panel p { margin:.2rem 0 .5rem; color:var(--ch-soft); }
.panel ul { margin:.2rem 0 .4rem; padding-left:1.1rem; color:var(--ch-soft); }
.panel li { margin:.15rem 0; }
.panel a { color:var(--ch-ice-l); }
.panel .act { margin-top:.8rem; width:100%; border-color:var(--ch-gold); color:var(--ch-gold-l); font-size:16px; }
.facts { display:grid; grid-template-columns:max-content 1fr; gap:.1rem .9rem; margin:.4rem 0 .6rem; font-size:15px; }
.facts dt { color:var(--ch-muted); margin:0; font:inherit; letter-spacing:0; text-transform:none; }
.facts dd { margin:0; color:var(--ch-soft); }
.hint { color:var(--ch-muted); font-style:italic; }
.dmbox { border:1px solid var(--ch-violet); border-left-width:3px; background:rgba(150,131,196,.09); padding:.5rem .8rem .2rem; margin:1rem 0; border-radius:3px; }
.dmbox h3 { color:var(--ch-violet-l); margin-top:.3rem; }
.tray h2 { font-family:var(--display); font-weight:500; font-size:14px; letter-spacing:.06em; color:var(--ch-muted); margin:0 0 .5rem; border:0; }
.chips { display:flex; flex-wrap:wrap; gap:.45rem; }
.chart-shell .chip { font-family:var(--serif); font-size:15px; background:var(--ch-raised); color:var(--ch-soft); border:1px dashed var(--ch-rule); border-radius:999px; padding:.3rem .8rem; cursor:pointer; min-height:36px; }
.chart-shell .chip.is-selected { border-style:solid; border-color:var(--ch-gold); color:var(--ch-text); }

/* SVG */
.node { cursor:pointer; }
.lbl { font-family:var(--display); font-weight:500; fill:#c6d2e2; letter-spacing:.03em; paint-order:stroke; stroke:#070a12; stroke-width:6px; stroke-linejoin:round; }
.lbl-sub { font-family:var(--serif); font-style:italic; fill:#8797ad; paint-order:stroke; stroke:#070a12; stroke-width:6px; stroke-linejoin:round; }
.node:hover .lbl, .node.is-selected .lbl { fill:#e2ae7e; }
.node.is-selected .sel { stroke:#e2ae7e; stroke-opacity:1; stroke-width:4; }
.hidden-layer, .con-layer, .ins-layer, .gtc-layer { transition:opacity .35s; }
.hidden-off .hidden-layer { opacity:0; pointer-events:none; }
.con-off .con-layer { opacity:0; pointer-events:none; }
.ins-off .ins-layer { opacity:0; pointer-events:none; }
.beacon-off .gtc-layer { opacity:0; }
.labels-off .ann, .mono-off .monolith-icon { display:none; }
@media (prefers-reduced-motion: reduce) { .hidden-layer, .con-layer, .ins-layer, .gtc-layer { transition:none; } }

/* 3D */
.view-3d { position:relative; }
.view-3d iframe { flex:1 1 auto; display:block; width:100%; min-height:0; border:1px solid var(--ch-rule); border-radius:6px; background:#080b12; }

/* Phone and narrow: the nav is a 44px bar and the body is padded 52px. */
@media (max-width:979px) {
  .chart-shell { height:auto; }
  #map { flex:none; height:62vh; height:62dvh; min-height:340px; }
  .side { overflow:visible; }
  .chart-shell.is-3d { height:100vh; height:100dvh; }
}
@media (max-width:768px) {
  .chart-shell { padding:.5rem 16px 1rem; }
  .chart-shell.is-3d { height:calc(100vh - 52px); height:calc(100dvh - 52px); }
  .chart-head h1 { font-size:19px; }
  .legend { font-size:13px; }
}

/* Embedded (Locations): the host page has the nav and the title. */
html.is-framed .side-nav, html.is-framed .side-nav-toggle { display:none !important; }
html.is-framed body.with-sidebar { padding:0 !important; }
html.is-framed .chart-title { display:none; }
html.is-framed .chart-shell, html.is-framed .chart-shell.is-3d { height:100vh; }
</style>

<main class="chart-shell" id="chart" data-listen-skip>
  <header class="chart-head">
    <div class="chart-title"><span class="chart-eyebrow">World</span><h1>The Rykoe Cosmos</h1></div>
    <div class="view-switch" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tab-2d" aria-controls="view-2d" aria-selected="true" data-view="2d">Map</button>
      <button type="button" role="tab" id="tab-3d" aria-controls="view-3d" aria-selected="false" data-view="3d">3D</button>

      <button class="btn" id="toggleBeacon" aria-pressed="true" type="button" hidden>Beacon: on</button>
      <button class="btn" id="toggleCon" aria-pressed="true" type="button" hidden>Constellations: on</button>
      <button class="btn" id="toggleHidden" aria-pressed="false" type="button" hidden>Hidden layer: off</button>
      <button class="btn" id="toggleLabels" aria-pressed="true" type="button" hidden>Labels: on</button>
      <button class="btn" id="toggleMono" aria-pressed="true" type="button" hidden>Monolith: on</button>
    </div>

<script>
/* The record for systems and galaxies is prime/data/survey.json, kept with
   scripts/survey.js. This page reads it and adds only what a chart needs:
   where things sit, how they are drawn, and the inscription. */
const SURVEY_URL = "../data/survey.json";
const LV = { cosmos:{W:3200,H:3000}, galaxy:{W:4400,H:3800}, system:{W:1400,H:1400,cx:700,cy:700,R:560} };
const CEN = {x:1600, y:1500};
const GX = {cx:2200, cy:1900, R:1650};

/* ---------- seeded dice and the galaxy's geometry (galaxy.js) ---------- */
const { rng, gauss, armPt } = window.EREVOS;
const rad = d => d*Math.PI/180;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

/* ---------- the cosmos ---------- */
const COSMOS = {
  rykoe: { id:"rykoe", name:"Rykoe", kind:"Center of the cosmos", page:"rykoe.html",
    summary:`The remains of the Reach world: a black hole, with the Core Monolith and the Radiant Citadel above it. Every galaxy's core is to its galaxy what Rykoe is to the cosmos.`,
    there:[`<strong>Core Monolith</strong>: the first Monolith, standing where Continuity first answered, when the people of the Reach reached into it and their world was destroyed. It has a degree of sentience and presses an idea outward through the cosmos. Those who dwell in it call it Aurath.`,
      `<strong>Radiant Citadel</strong>: the civilization around the Core Monolith.`,
      `<strong>Black hole</strong>: what is left of the Reach world, beneath the Monolith. Its remains spread across the cosmos.`],
    travel:`Scholars of Caelestis know their galaxy is one part of something larger, with something at its center. No one they know has reached it.`,
    dm:[`Rykoe opens only when the cores of all five galaxies are awake and joined: each core to its neighbours, and each to Rykoe. Through it lies Continuity, where whoever reaches it can push and pull the Axioms and remake reality.`,
      `Vecna (Lich), the mortal form archived when Vecna ascended, sits in the Radiant Citadel.`,
      `The Radiant Citadel and the Core Monolith are late Arc 3 or Arc 4 destinations, reached by a long voyage or through a linked heart.`] },
  fifths: { id:"fifths", name:"Circle of Fifths", kind:"Vecna's working, across the cosmos",
    summary:`Five galaxies, each a fifth of what Vecna needs, around the center where the Axioms meet. The name is his alone, taken from the circle of fifths in music.`,
    there:[`<strong>Spokes</strong>: each galaxy's core joined to Rykoe.`,`<strong>Rim</strong>: each core joined to its two neighbours.`],
    dm:[`Vecna works GAL-01's core with spellwork, an inscription drawn in linked heart worlds. In each other galaxy another being works its core by its own method.`,
      `No one else knows what he is building: the Seekers, the Order and most gods have no name for it. A few on the fringes sense something wrong in the cosmos, and no one believes them.`,
      `The failure state is GAL-01's core waking for Vecna. If GAL-01 falls, GAL-03, GAL-04 and GAL-05 fall with it, and Rykoe can open. Success in GAL-01 holds them, though work remains.`] }
};
/* Pentagon around Rykoe, GAL-01 at the top, clockwise. */
const GAL_DRAW = {
  "GAL-01": { ang:-90, tone:"#e2ae7e", core:"asleep", spin:0.0,
    line1:"Caelestis · D&D 5e", line2:"core asleep · three links",
    summary:`Caelestis's galaxy, and the only one it charts. Its systems crowd along four spiral arms around a sleeping core, and the galaxy thins toward its edge.`,
    there:[`Pieces of three Reach fragments, Consolidation, Dissolution and Distinction, both by chance and by pull: once a few came to rest near Realmspace, more followed.`,
      `Realmspace, Caelestis's home system, and the sister institutions of the higher organization across the galaxy.`,
      `Oerth, in Greyspace, where Vecna became a god.`],
    dm:[`Runs as D&D 5e. The keystone: what happens here decides GAL-03, GAL-04 and GAL-05.`,
      `Two hearts in neighbouring systems on the upper lid are opened and linked to each other, and each is linked to Oerth: three links. One more heart, Nowhere's on the lower lid, is found and not opened. The rest of the fifteen are unknown.`,
      `GAL-02's awake core presses on this one. Late in the campaign it can pull the crew into the eldritch galaxy.`] },
  "GAL-02": { ang:-18, tone:"#d07070", core:"awake", spin:1.3,
    line1:"eldritch gods · Call of Cthulhu", line2:"core awake · overrun",
    summary:`A galaxy whose gods are eldritch, none of them good. Its core is already awake, and dark beings overrun it. It has no Weave; the Axioms and Continuity still hold there.`,
    there:[`Gods wearing names closer to Earth's own pantheons, each drawn here because this is where it is worshipped most.`],
    dm:[`Runs as Call of Cthulhu.`,`Its awake core presses on GAL-01's. If the crew is pulled in, the rules become Call of Cthulhu, and what they do there is get home, or close what is open.`] },
  "GAL-03": { ang:54, tone:"#b9a5d8", core:"partway", spin:2.4, line1:"game system open", line2:"partway",
    summary:`Another being works this galaxy's core toward the same end as Vecna, by its own method. The work is partway.`, there:[],
    dm:[`Takes its game system before any campaign goes there.`,`Its fate turns on GAL-01: if GAL-01's core wakes for Vecna, this galaxy falls with it.`] },
  "GAL-04": { ang:126, tone:"#b9a5d8", core:"partway", spin:3.7, line1:"game system open", line2:"partway",
    summary:`Another being works this galaxy's core toward the same end as Vecna, by its own method. The work is partway.`, there:[],
    dm:[`Takes its game system before any campaign goes there.`,`Its fate turns on GAL-01: if GAL-01's core wakes for Vecna, this galaxy falls with it.`] },
  "GAL-05": { ang:198, tone:"#b9a5d8", core:"partway", spin:5.0, line1:"game system open", line2:"partway",
    summary:`Another being works this galaxy's core toward the same end as Vecna, by its own method. The work is partway.`, there:[],
    dm:[`Takes its game system before any campaign goes there.`,`Its fate turns on GAL-01: if GAL-01's core wakes for Vecna, this galaxy falls with it.`] }
};
const CORE_TONE = { asleep:"#e2ae7e", awake:"#e0605a", partway:"#b9a5d8" };
const CORE_WORD = { asleep:"Core asleep", awake:"Core awake", partway:"Core partway" };

/* ---------- GAL-01: where the saved systems sit ---------- */
const RS = armPt(0, 2.1);
const OUT = (() => { const dx = RS[0]-GX.cx, dy = RS[1]-GX.cy, l = Math.hypot(dx,dy); return [dx/l, dy/l]; })();
const TAN = [-OUT[1], OUT[0]];
const at = (base, o, t) => [Math.round(base[0] + OUT[0]*o + TAN[0]*t), Math.round(base[1] + OUT[1]*o + TAN[1]*t)];
const CLUSTER = { x:RS[0], y:RS[1], rx:880, ry:600, rot:Math.atan2(TAN[1],TAN[0])*180/Math.PI };

/* Chart-only facts about each saved system: position, tone, page, routes. */
const SYS_CHART = {
  "Realmspace": { pos:RS, tone:"#9cc0e0", page:"realmspace.html",
    travel:`Charted lane to the Astral waystation and on to Virenspace. Charted lanes to Strake Station and Hollis Post, the watch at the system's edge; closed beyond Strake. Long haul to CSC 56973. Uncharted route to Krynnspace.` },
  "CSC 69387": { pos:at(RS, -40, 760), tone:"#c9b3ea", page:"virenspace.html", haze:true,
    travel:`Long haul onward from the Astral waystation. Long haul to CSC 56973.` },
  "CSC 56973": { pos:at(RS, -120, -720), tone:"#e2ae7e", page:"aethris.html",
    travel:`Long haul from Realmspace, passing the carved-meteor hub. Long haul to Virenspace.` },
  "CSC 16423": { pos:armPt(0, 1.2, 30), tone:"#9fe1cb", page:"krynnspace.html",
    travel:`Uncharted route from Realmspace, far beyond the watch at Realmspace's edge.` },
  "CSC 50743": { pos:window.EREVOS.POS.fonains.map(Math.round), tone:"#9fe1cb", page:"fonains.html",
    travel:`Neighbours Krynnspace, at the far end of the uncharted route from Realmspace. Clint Dashforest reached Fonains through a color pool.` },
  "Greyspace": { pos:armPt(2, 2.7, -20), tone:"#e2ae7e", page:"oerth.html#greyspace",
    travel:`Far across the galaxy, on the opposite arm from Realmspace. No lane on Caelestis's charts reaches it.` },
  "GAL-01-hidden": { pos:[3250, 950], tone:"#c9b3ea", page:"wayfinders-homeworld.html", hidden:true, veiled:true,
    travel:`No route. Wayfinders leave with no map and no name, and must re-recognize home.`,
    dm:[`Its position on this chart is symbolic.`,`The Runekeepers' fragment is rebuilding in two halves, in Wan and Tu.`] }
};
/* How each body is drawn inside its system. d: distance in millions of miles
   (Realmspace only); orbit: fraction of the system edge; a: angle in degrees. */
const BODY_CHART = {
  "Anadia":{d:50,a:205,size:10}, "Coliar":{d:100,a:318,size:14}, "Toril":{d:200,a:24,size:16,page:"toril.html"},
  "Karpri":{d:300,a:140,size:12}, "Chandos":{d:400,a:252,size:12}, "Glyth":{d:1000,a:78,size:12,ring:true,page:"glyth.html", note:`An outer world on a long orbit, with three moons and a rare approach window. The Fleet bans approach.`},
  "Garden":{d:1200,a:172,size:13}, "H'Catha":{d:1600,a:292,size:14,page:"../locations/hcatha.html"},
  "Caelestis":{of:"Toril",dx:46,dy:-56,shape:"diamond",page:"caelestis.html"}, "Tyrant ship":{of:"Toril",dx:66,dy:42,shape:"square"},
  "Selûne":{of:"Toril",dx:-44,dy:30,shape:"moon"},
  "Oerth":{orbit:.5,a:140,size:16,mono:"holy",page:"oerth.html", note:`Oerth's heart has been Vecna's since his ascension charged him into it. Every heart in the inscription links back to it.`},
  "Aethris":{orbit:.5,a:32,size:18,prism:true,page:"aethris.html", note:`The Prism Ascendant is the Monolith that answered Aethris's Zenith. The Zenith came in Cycle 1490; what stands incomplete is the Fortuned's ritual. The Prism has archived what it can and stays where it is.`},

    travel:`A charted lane runs from Toril's part of the system out along the Tetherbreak bearing to Strake Station, and is open. Everything beyond Strake is closed without Bridge authorization.`,
    there:[`Strake Station: a waystation with a small Fleet presence watching the edge, and the last open deck on the run to Cairn. It keeps the staged Cairn approach packet.`,`Cairn Station: silent for a year, after reporting a mass signature that read differently on every sweep. Nobody has been back.`,`<em>Bellwether Crow</em>: relief vessel, ambushed on the edge run past Strake and turned back short of Cairn.`,`M. Tarroway: Strake's cartographer, whose readings were the first hint of something disturbing the satellites.`],

    travel:`Reached along the edge run from Strake Station. Closed by SA-005. Nobody has reached it since the Crow turned back.`,

    there:[`Clint steered for a color pool he could see opening and went through it. Some of the boarders went after him and some stayed, and enough of them went that the crew fended off the rest. The pool carried him through a small pocket of another dimension and out onto Fonains, in Krynnspace, apart from the boarders who followed him in.`,`A second boarding action followed, by a different party. The senior deck officers and most of the complement were lost. The <em>Crow</em> broke off under damage, made Strake Station and reached Fleet anchorage days behind schedule.`,`Crewmate Joffrey held the survivors together through the withdrawal and brought them off the deck alive. He was decorated on their unanimous account and posted to Caelestis.`,`The survivors still argue about whether Clint meant to go through. In the Fleet, he went overboard.`],

(function placeSites(){
  const s = id => SITES.find(x=>x.id===id);
  const toK = (() => { const k = SYS_CHART["CSC 16423"].pos, dx = k[0]-RS[0], dy = k[1]-RS[1], l = Math.hypot(dx,dy); return [dx/l, dy/l]; })();
  const mid = (() => { const x = OUT[0]+toK[0], y = OUT[1]+toK[1], l = Math.hypot(x,y); return [x/l, y/l]; })();
  [s("strake").x, s("strake").y] = at(RS, CLUSTER.ry, 0);
  [s("hollis").x, s("hollis").y] = at(RS, -CLUSTER.ry, 0);
  s("cairn").x = Math.round(RS[0] + mid[0]*1150); s("cairn").y = Math.round(RS[1] + mid[1]*1150);
  s("tetherbreak").x = Math.round((s("strake").x + s("cairn").x)/2 + mid[0]*80); s("tetherbreak").y = Math.round((s("strake").y + s("cairn").y)/2 + mid[1]*80);
})();

function buildFromSurvey(sv){
  SURVEY = sv;
  GALAXIES = sv.galaxies.map(g => Object.assign({ id:g.id, label:g.name ? `${g.name} · ${g.id}` : g.id, record:g }, GAL_DRAW[g.id] || {}));
  SYSTEMS = sv.systems.filter(s => SYS_CHART[s.id]).map(s => {
    const c = SYS_CHART[s.id], named = s.name || (s.catalogue ? "CSC " + s.catalogue : null);
    return Object.assign({ id:s.id, galaxy:s.galaxy, record:s,
      label: s.home || !s.catalogue ? (named || (s.id==="GAL-01-hidden" ? "Wayfinders' system" : s.id)) : (s.name || s.id),
      sub: s.name && s.catalogue ? "CSC " + s.catalogue + (s.home ? " · home system" : "") : (s.home ? "home system" : ""),
      x:c.pos[0], y:c.pos[1] }, c);
  });
  /* Unnamed systems: survey.js rolls, by seed, placed along the arms by
     galaxy.js. Each reads as `node scripts/survey.js roll --seed N` would
     print it; the survey keeps only the systems someone saves. */
  window.EREVOS.rollSystems(sv);
  UNNAMED = window.EREVOS.FILLERS.map(f => ({ id:"u"+f.i, x:Math.round(f.pos[0]), y:Math.round(f.pos[1]), status:f.sys.status,
    name:f.sys.id, kind:"Star system" + (f.sys.bayer ? " · " + f.sys.bayer : ""), summary:f.summary,
    dm:[`A survey.js roll, seed ${f.sys.seed}. Keep it with <code>node scripts/survey.js roll --seed ${f.sys.seed} --save</code>, and give it a place on the chart when the crew turns toward it.`] }));
}

function backdrop(W,H,seed,count,dim){
  const S = Math.max(W,H), ox = W/2-S*2.5, oy = H/2-S*2.5*0.667;
  let o = `<defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="28"/></filter>
    <radialGradient id="g-hole"><stop offset="0%" stop-color="#000000"/><stop offset="55%" stop-color="#05030a"/><stop offset="72%" stop-color="#f0a0c8" stop-opacity=".55"/><stop offset="84%" stop-color="#8fe8df" stop-opacity=".25"/><stop offset="100%" stop-color="#8fe8df" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-core"><stop offset="0%" stop-color="#fff6e6"/><stop offset="35%" stop-color="#ffd9a8" stop-opacity=".9"/><stop offset="100%" stop-color="#ffd9a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-asleep"><stop offset="45%" stop-color="#e2ae7e" stop-opacity=".45"/><stop offset="100%" stop-color="#e2ae7e" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-awake"><stop offset="40%" stop-color="#e0605a" stop-opacity=".6"/><stop offset="100%" stop-color="#e0605a" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-partway"><stop offset="45%" stop-color="#b9a5d8" stop-opacity=".4"/><stop offset="100%" stop-color="#b9a5d8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-bulge"><stop offset="0%" stop-color="#fff1d6" stop-opacity=".22"/><stop offset="60%" stop-color="#9cc0e0" stop-opacity=".07"/><stop offset="100%" stop-color="#9cc0e0" stop-opacity="0"/></radialGradient>
  </defs>`;
  o += `<rect x="${W/2-S*3}" y="${H/2-S*3}" width="${S*6}" height="${S*6}" fill="#05060d"/>`;
  if(ASTRAL) o += `<image href="${ASTRAL}" x="${ox}" y="${oy}" width="${S*5}" height="${S*5*0.667}" preserveAspectRatio="none"/>`;
  o += `<rect x="${W/2-S*3}" y="${H/2-S*3}" width="${S*6}" height="${S*6}" fill="#05060d" fill-opacity="${dim||.45}"/>`;
  const r = rng(seed);
  for(let i=0;i<count*3;i++) o += `<circle cx="${(W/2-S*1.5+r()*S*3).toFixed(0)}" cy="${(H/2-S*1.5+r()*S*3).toFixed(0)}" r="${(r()<.92?1.2+r()*1.6:3+r()*2).toFixed(1)}" fill="#eef6ff" opacity="${(.15+r()*.4).toFixed(2)}"/>`;
  return o;
}
function coreGlyph(x,y,r,state){
  return `<circle cx="${x}" cy="${y}" r="${r*3.2}" fill="url(#g-${state})"/>
    <circle cx="${x}" cy="${y}" r="${r}" fill="#000" stroke="${CORE_TONE[state]}" stroke-width="${Math.max(2,r/9)}"/>`;
}
/* A spiral drawn as dust. Used small at the cosmos level and full size inside a galaxy. */
function spiralDust(cx,cy,R,spin,seed,n,col,op,dot,arms){
  const r = rng(seed); let d = ""; arms = arms || 2;
  const pt = (arm,t,jr,ja) => { const ang = t*1.55 + arm*2*Math.PI/arms + .35 + ja + spin, rr = R*(0.09 + t/3.6) + jr; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)*.9]; };
  for(let i=0;i<n;i++){ const p = pt(i%arms, 3.3*Math.sqrt(r()), gauss(r)*R*.03, gauss(r)*.17);
    d += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(dot*(r()<.9?1+r()*.8:1.9)).toFixed(2)}" fill="${col}" opacity="${(op*(.35+r()*.65)).toFixed(2)}"/>`; }
  for(let i=0;i<n/7;i++){ const rr = Math.abs(gauss(r))*R*.09, a = r()*Math.PI*2;
    d += `<circle cx="${(cx+rr*Math.cos(a)).toFixed(1)}" cy="${(cy+rr*Math.sin(a)*.9).toFixed(1)}" r="${(dot*1.2).toFixed(2)}" fill="${col}" opacity="${(op*(.4+r()*.5)).toFixed(2)}"/>`; }
  return d;
}

/* ---------- cosmos ---------- */
/* The Core Monolith, drawn above Rykoe's black hole. Its own element, so
   the Monolith toggle can hide it and the drawing can be swapped here. */
function monolithIcon(cx, cy){
  const CEN = {x:cx, y:cy};
  return `<g class="monolith-icon">
    <circle cx="${CEN.x}" cy="${CEN.y-130}" r="90" fill="url(#g-core)"/>
    <path d="M${CEN.x-16} ${CEN.y-70} L${CEN.x-13} ${CEN.y-172} L${CEN.x} ${CEN.y-196} L${CEN.x+13} ${CEN.y-172} L${CEN.x+16} ${CEN.y-70} Z" fill="#fff6e6" fill-opacity=".92" stroke="#ffd9a8" stroke-width="2"/>
    <line x1="${CEN.x}" y1="${CEN.y-168}" x2="${CEN.x}" y2="${CEN.y-84}" stroke="#c08652" stroke-opacity=".55" stroke-width="2"/></g>`;
}
function galPos(g){ const R = 1050; return [Math.round(CEN.x + R*Math.cos(rad(g.ang))), Math.round(CEN.y + R*Math.sin(rad(g.ang)))]; }
function renderCosmos(){
  view = {level:"cosmos"}; canvas = LV.cosmos; registry = {};
  let o = backdrop(canvas.W, canvas.H, 5, 500);
  o += `<text class="lbl-sub ann" x="110" y="150" font-size="46">the Astral Sea, where the greater gods dwell</text>`;
  const pos = Object.fromEntries(GALAXIES.map(g=>[g.id, galPos(g)]));
  /* Circle of Fifths: spokes and rim */
  let lines = "", hit = "";
  GALAXIES.forEach((g,i) => {
    const p = pos[g.id], q = pos[GALAXIES[(i+1)%GALAXIES.length].id];
    lines += `<line x1="${q[0]}" y1="${q[1]}" x2="${p[0]}" y2="${p[1]}" stroke="#9678bd" stroke-opacity=".55" stroke-width="4" stroke-dasharray="14 16"/>`;
    lines += `<line x1="${p[0]}" y1="${p[1]}" x2="${CEN.x}" y2="${CEN.y}" stroke="#9678bd" stroke-opacity=".8" stroke-width="6"/>`;
    hit += `<line x1="${q[0]}" y1="${q[1]}" x2="${p[0]}" y2="${p[1]}" stroke="transparent" stroke-width="60"/><line x1="${p[0]}" y1="${p[1]}" x2="${CEN.x}" y2="${CEN.y}" stroke="transparent" stroke-width="60"/>`;
  });
  const p3 = pos["GAL-03"], p4 = pos["GAL-04"];
  o += `<g ${reg("fifths",COSMOS.fifths)}>${hit}${lines}<text class="lbl-sub ann" x="${(p3[0]+p4[0])/2}" y="${p3[1]+250}" text-anchor="middle" font-size="44" fill="#b9a5d8">Circle of Fifths</text></g>`;
  /* Rykoe */
  const c = COSMOS.rykoe;
  o += `<g ${reg("rykoe",c)}><circle cx="${CEN.x}" cy="${CEN.y}" r="230" fill="transparent"/>
    <circle cx="${CEN.x}" cy="${CEN.y+20}" r="230" fill="#c05aa0" fill-opacity=".18" filter="url(#softer)"/>
    <circle class="sel" cx="${CEN.x}" cy="${CEN.y+20}" r="120" fill="url(#g-hole)"/>
    <circle cx="${CEN.x}" cy="${CEN.y+20}" r="58" fill="#000" filter="url(#soft)"/>
    ${monolithIcon(CEN.x, CEN.y)}
    <text class="lbl" x="${CEN.x}" y="${CEN.y+205}" text-anchor="middle" font-size="62">Rykoe</text>
    <text class="lbl-sub ann" x="${CEN.x}" y="${CEN.y+255}" text-anchor="middle" font-size="34">Core Monolith · Radiant Citadel</text></g>`;
  /* galaxies */
  for(const g of GALAXIES){
    const [x,y] = pos[g.id], home = g.id==="GAL-01", R = home ? 270 : 220;
    const above = y < CEN.y - 200, ly = above ? y - R*.95 - 110 : y + R*.95 + 70;
    o += `<g ${reg(g.id,g)}><circle cx="${x}" cy="${y}" r="${R}" fill="transparent"/>
      ${home ? `<circle class="sel" cx="${x}" cy="${y}" r="${R}" fill="none" stroke="#e2ae7e" stroke-opacity=".55" stroke-width="3" stroke-dasharray="6 12"/>` : `<circle class="sel" cx="${x}" cy="${y}" r="${R}" fill="none" stroke="${g.tone}" stroke-opacity=".0" stroke-width="3"/>`}
      ${spiralDust(x,y,R*.95,g.spin,11+g.ang,home?620:420, home?"#bcd6f0":g.core==="awake"?"#f0b0a8":"#c9b3ea", home?.9:.7, 3.4, home?4:2)}
      ${coreGlyph(x,y,home?26:22,g.core)}
      <text class="lbl" x="${x}" y="${ly}" text-anchor="middle" font-size="${home?60:52}" fill="${home?"#e2ae7e":"#c6d2e2"}">${esc(g.label)}</text>
      <text class="lbl-sub ann" x="${x}" y="${ly+52}" text-anchor="middle" font-size="40">${esc(g.line1||"")}</text>
      <text class="lbl-sub ann" x="${x}" y="${ly+100}" text-anchor="middle" font-size="40" fill="${CORE_TONE[g.core]}">${esc(g.line2||"")}</text></g>`;
  }
  svg.innerHTML = o;
  legend(`<span><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="2" y1="6" x2="32" y2="6" stroke="#9678bd" stroke-width="3"/></svg>Spoke: core to Rykoe</span>
    <span><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="2" y1="6" x2="32" y2="6" stroke="#9678bd" stroke-width="2" stroke-dasharray="5 4"/></svg>Rim: core to neighbouring core</span>`
    + Object.entries(CORE_WORD).map(([k,v])=>`<span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#000" stroke="${CORE_TONE[k]}" stroke-width="2"/></svg>${v}</span>`).join(""));
  crumbs([["Rykoe Cosmos",null]]); controls(); tray(false); fit();
}

/* ---------- galaxy ---------- */
const SR = 70;
function systemGlyph(s){
  const {x,y,tone} = s; let g = "";
  g += `<circle cx="${x}" cy="${y}" r="${SR}" fill="${tone}" fill-opacity="${s.veiled?.04:.08}"/>`;
  g += `<circle class="sel" cx="${x}" cy="${y}" r="${SR}" fill="none" stroke="${tone}" stroke-opacity=".75" stroke-width="3" stroke-dasharray="${s.veiled?"6 9":"12 8"}"/>`;
  g += `<circle cx="${x}" cy="${y}" r="30" fill="#e2ae7e" fill-opacity=".2"/><circle cx="${x}" cy="${y}" r="12" fill="#ffe3b8"/>`;
  if(s.haze) g += `<circle cx="${x}" cy="${y}" r="${SR*.75}" fill="none" stroke="#9678bd" stroke-opacity=".5" stroke-width="2" stroke-dasharray="3 7"/>`;
  g += `<text class="lbl" x="${x}" y="${y-SR-24}" text-anchor="middle" font-size="64">${esc(s.label)}</text>`;
  if(s.sub) g += `<text class="lbl-sub ann" x="${x}" y="${y+SR+56}" text-anchor="middle" font-size="44">${esc(s.sub)}</text>`;
  return `<g ${reg(s.id,s)}><circle cx="${x}" cy="${y}" r="${SR+24}" fill="transparent"/>${g}</g>`;
}
function siteGlyph(n){
  const {x,y} = n; let g = "";
  const T = `transform="translate(${x} ${y}) scale(1)"`;
  if(n.icon==="waystation") g = `<g ${T}><rect class="sel" x="-24" y="-24" width="48" height="48" transform="rotate(45)" fill="#1c2638" stroke="#e2ae7e" stroke-width="3"/><circle r="8" fill="#e2ae7e"/></g>`;
  if(n.icon==="cantina") g = `<g ${T}><ellipse rx="80" ry="28" transform="rotate(-35)" fill="none" stroke="#e2ae7e" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 10"/><circle class="sel" r="16" fill="#1c2638" stroke="#e2ae7e" stroke-width="3"/><circle cx="54" cy="-40" r="6" fill="#e2ae7e"/></g>`;
  if(n.icon==="meteor") g = `<g ${T}><path class="sel" d="M-26 -8 L-13 -26 L13 -24 L28 -5 L20 21 L-8 26 L-28 10 Z" fill="#2a2520" stroke="#e2ae7e" stroke-width="2.6"/><circle r="8" fill="#070a12" stroke="#e2ae7e" stroke-opacity=".7"/></g>`;
  if(n.icon==="incident") g = `<g ${T}><circle class="sel" r="20" fill="#1c1418" stroke="#f0a0c8" stroke-width="3"/><path d="M-9 -9 L9 9 M9 -9 L-9 9" stroke="#f0a0c8" stroke-width="3"/></g>`;
  if(n.icon==="region"){
    g = `<circle class="sel" cx="${x}" cy="${y}" r="${n.r}" fill="#b04a4a" fill-opacity=".06" stroke="#d07070" stroke-opacity=".5" stroke-width="3" stroke-dasharray="5 12"/>`;
    const p = [0,60,120,180,240,300].map(a=>`${(28*Math.cos(rad(a))).toFixed(1)},${(28*Math.sin(rad(a))).toFixed(1)}`).join(" ");
    g += `<g ${T}><polygon points="${p}" fill="#1c1418" stroke="#d07070" stroke-width="3"/><path d="M-10 -10 L10 10 M10 -10 L-10 10" stroke="#d07070" stroke-width="3"/></g>`;
  }
  const ly = n.icon==="region" ? y+n.r+66 : n.icon==="incident" ? y+14 : y+72, anchor = n.icon==="incident" ? "start" : "middle", lx = n.icon==="incident" ? x+34 : x;
  return `<g ${reg(n.id,n)}><circle cx="${x}" cy="${y}" r="${n.icon==="region"?n.r:48}" fill="transparent"/>${g}<text class="lbl" x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="${n.icon==="region"?48:42}">${esc(n.name)}</text></g>`;
}
function edgePad(n){ return (n.icon ? (n.icon==="region"?n.r:32) : SR) + 12; }
function laneGeom(l){
  const A = galNode(l.a), B = galNode(l.b), ang = Math.atan2(B.y-A.y, B.x-A.x);
  const x1 = A.x+Math.cos(ang)*edgePad(A), y1 = A.y+Math.sin(ang)*edgePad(A);
  const x2 = B.x-Math.cos(ang)*edgePad(B), y2 = B.y-Math.sin(ang)*edgePad(B);
  const bo = l.bendOut||0, bt = l.bendTan||0;
  return {x1,y1,x2,y2, mx:(x1+x2)/2 + OUT[0]*bo + TAN[0]*bt, my:(y1+y2)/2 + OUT[1]*bo + TAN[1]*bt};
}
const qpt = (g,t) => [(1-t)*(1-t)*g.x1+2*(1-t)*t*g.mx+t*t*g.x2, (1-t)*(1-t)*g.y1+2*(1-t)*t*g.my+t*t*g.y2];
function placeLaneSites(){ for(const s of SITES){ if(!s.onLane) continue; const l = LANES.find(q=>q.a===s.onLane[0]&&q.b===s.onLane[1]); [s.x,s.y] = qpt(laneGeom(l), s.t).map(Math.round); } }
function lanePath(l){
  const g = laneGeom(l), s = LANE[l.tier];
  const path = (a,b,st) => { st = st||s; let d=""; for(let i=0;i<=30;i++){ const [px,py] = qpt(g,a+(b-a)*i/30); d += (i?"L":"M")+px.toFixed(0)+" "+py.toFixed(0); }
    return `<path d="${d}" fill="none" stroke="${st.stroke}" stroke-opacity="${st.op}" stroke-width="${st.w}" stroke-dasharray="${st.dash}" stroke-linecap="round"/>`; };
  if(l.split){ const t0 = siteById(l.split).t; return path(0,t0-.03)+path(t0+.03,1,LANE.long); }
  return path(0,1);
}
function constellationGlyph(c){
  const dir = [Math.sin(rad(c.bearing)), -Math.cos(rad(c.bearing))];
  const x0 = RS[0]+dir[0]*(SR+20), y0 = RS[1]+dir[1]*(SR+20), x1 = RS[0]+dir[0]*880, y1 = RS[1]+dir[1]*880;
  const xs0 = c.stars.map(p=>p[0]), ys0 = c.stars.map(p=>p[1]);
  const mx = (Math.min(...xs0)+Math.max(...xs0))/2, my = (Math.min(...ys0)+Math.max(...ys0))/2;
  const fx = RS[0]+dir[0]*1060, fy = RS[1]+dir[1]*1060, s = 1.3;
  const pts = c.stars.map(([sx,sy])=>[fx+(sx-mx)*s, fy+(sy-my)*s]);
  const lines = c.lines.map(([a,b])=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="#ffe3b8" stroke-opacity=".5" stroke-width="2.5"/>`).join("");
  const stars = pts.map(([px,py],i)=>`<circle cx="${px}" cy="${py}" r="${i%3?6:9}" fill="#fff3d6"/><circle cx="${px}" cy="${py}" r="18" fill="#ffe3b8" fill-opacity=".15"/>`).join("");
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  return `<line x1="${x0.toFixed(0)}" y1="${y0.toFixed(0)}" x2="${x1.toFixed(0)}" y2="${y1.toFixed(0)}" stroke="#ffe3b8" stroke-opacity=".22" stroke-width="2" stroke-dasharray="2 12"/>
    <g ${reg(c.id,c)}><rect x="${Math.min(...xs)-30}" y="${Math.min(...ys)-30}" width="${Math.max(...xs)-Math.min(...xs)+60}" height="${Math.max(...ys)-Math.min(...ys)+60}" fill="transparent"/>${lines}${stars}<text class="lbl" x="${(Math.min(...xs)+Math.max(...xs))/2}" y="${Math.max(...ys)+62}" text-anchor="middle" font-size="46" fill="#ffe3b8">${esc(c.label)}</text></g>`;
}
function unnamedGlyph(u){
  const sighted = u.status!=="sighted";   /* charted or surveyed: drawn solid; only sighted: an outline */
  return `<g ${reg(u.id,u)}><circle cx="${u.x}" cy="${u.y}" r="36" fill="transparent"/>
    <circle class="sel" cx="${u.x}" cy="${u.y}" r="${sighted?15:14}" fill="${sighted?"#9cc0e0":"none"}" fill-opacity="${sighted?.55:0}" stroke="#9cc0e0" stroke-opacity="${sighted?.85:.55}" stroke-width="3" stroke-dasharray="${sighted?"":"5 5"}"/></g>`;
}
function renderGalaxy(gid){

  const coreN = { id:gid+"-core", name:(g.record && g.record.core_name) ? g.record.core_name : gid+" core", kind:"Galactic core, a black hole", core:g.core, galaxy:gid };

    <text class="lbl" x="${GX.cx}" y="${GX.cy+130}" text-anchor="middle" font-size="56">${esc(coreN.name)}</text>

    const cl = at(RS, CLUSTER.ry+40, CLUSTER.rx*.55);

    /* The Fleet's four sectors, one along each arm. Only the Caelestis Sector has a name. */
    o += window.EREVOS.SECTORS.map(sc => `<text class="lbl-sub ann" x="${sc.pos[0].toFixed(0)}" y="${sc.pos[1].toFixed(0)}" text-anchor="middle" font-size="54" fill="#6E95D4" opacity=".75" letter-spacing="8">${esc(sc.name)}</text>`).join("");
    o += UNNAMED.map(unnamedGlyph).join("");

    placeLaneSites();
    o += LANES.map(lanePath).join("");
    o += SITES.filter(s=>s.icon==="region").map(siteGlyph).join("");
    o += SYSTEMS.filter(s=>s.galaxy===gid && !s.hidden).map(systemGlyph).join("");
    o += SITES.filter(s=>s.icon!=="region").map(siteGlyph).join("");
    o += `<g class="hidden-layer">${SYSTEMS.filter(s=>s.galaxy===gid && s.hidden).map(systemGlyph).join("")}</g>`;
  } else {

  o += `</g>`;
  if(home) o += `<g class="ins-layer" id="ins"></g>`;

/* The inscription from above. From Oerth the hearts line up into the eye;
   that view is the 3D one (See it from Oerth). */
function drawInscription(){
  const host = document.getElementById("ins"); if(!host) return;
  const K = 1/window.EREVOS.S;                         /* scene height to chart units */
  const P = Object.fromEntries(HEARTS.map(h=>[h.id, [h.x, h.y - h.height*K]]));
  const oer = SYS_CHART["Greyspace"].pos;
  let o = "";
  /* every heart's link back to Oerth, the cone; the three standing links are solid */
  for(const h of HEARTS){ if(PAIR_IDS.includes(h.id)) continue; const p = P[h.id];
    o += `<line x1="${p[0].toFixed(0)}" y1="${p[1].toFixed(0)}" x2="${oer[0].toFixed(0)}" y2="${oer[1].toFixed(0)}" stroke="#9683c4" stroke-opacity=".38" stroke-width="3" stroke-dasharray="4 12"/>`; }
  const loop = (ids, col, w, dash, op) => ids.map((id,i)=>{ const p = P[id], q = P[ids[(i+1)%ids.length]];
    return `<line x1="${p[0].toFixed(0)}" y1="${p[1].toFixed(0)}" x2="${q[0].toFixed(0)}" y2="${q[1].toFixed(0)}" stroke="${col}" stroke-opacity="${op}" stroke-width="${w}" stroke-dasharray="${dash}"/>`; }).join("");
  o += loop(LID_LOOP, "#9fb4d0", 4, "18 14", .5);
  o += loop(IRIS_LOOP, "#D45F78", 4, "12 10", .55);
  const [a, b] = PAIR_IDS.map(id => P[id]);
  [[a,b],[a,oer],[b,oer]].forEach(([p,q]) => { o += `<line x1="${p[0].toFixed(0)}" y1="${p[1].toFixed(0)}" x2="${q[0].toFixed(0)}" y2="${q[1].toFixed(0)}" stroke="#56B4A6" stroke-opacity=".9" stroke-width="6"/>`; });
  /* Oerth: the retina */
  const oN = { id:"oerth-ins", name:"Oerth", kind:"Greyspace · the eye's retina" };
  o += `<g ${reg(oN.id,oN)}><circle cx="${oer[0].toFixed(0)}" cy="${oer[1].toFixed(0)}" r="60" fill="transparent"/>
    <circle cx="${oer[0].toFixed(0)}" cy="${oer[1].toFixed(0)}" r="60" fill="#D4A256" fill-opacity=".14"/>
    <circle class="sel" cx="${oer[0].toFixed(0)}" cy="${oer[1].toFixed(0)}" r="26" fill="#D4A256" stroke="#fff1d6" stroke-width="3"/>
    <text class="lbl" x="${oer[0].toFixed(0)}" y="${(oer[1]+92).toFixed(0)}" text-anchor="middle" font-size="56" fill="#D4A256">Oerth</text>
    <text class="lbl-sub" x="${oer[0].toFixed(0)}" y="${(oer[1]+142).toFixed(0)}" text-anchor="middle" font-size="40">the retina</text></g>`;
  /* the hearts, each in its own system */
  for(const h of HEARTS){
    const p = P[h.id], st = HSTATE[h.state], iris = h.part==="iris", ring = iris ? "#D45F78" : "#9fb4d0";
    let g = `<circle cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="70" fill="transparent"/>`;
    if(Math.abs(h.height*K) > 4) g += `<line x1="${p[0].toFixed(0)}" y1="${p[1].toFixed(0)}" x2="${h.x.toFixed(0)}" y2="${h.y.toFixed(0)}" stroke="${ring}" stroke-opacity=".5" stroke-width="3"/><circle cx="${h.x.toFixed(0)}" cy="${h.y.toFixed(0)}" r="6" fill="${ring}" fill-opacity=".45"/>`;
    g += `<circle cx="${(p[0]-50).toFixed(0)}" cy="${p[1].toFixed(0)}" r="22" fill="#ffe3b8" fill-opacity=".18"/><circle cx="${(p[0]-50).toFixed(0)}" cy="${p[1].toFixed(0)}" r="10" fill="#fff1d6"/>`;
    if(iris) g += `<circle cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="54" fill="none" stroke="#D45F78" stroke-opacity=".9" stroke-width="5"/>`;
    g += `<circle class="sel" cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="34" fill="#0b1019" stroke="${ring}" stroke-width="5"/>`;
    g += `<circle cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="22" fill="${st.col}"/>`;
    g += `<text class="lbl-sub" x="${(p[0]+44).toFixed(0)}" y="${(p[1]-34).toFixed(0)}" font-size="50" fill="#dfe6f0">${h.n}</text>`;
    o += `<g ${reg(h.id,h)}>${g}</g>`;
  }
  host.innerHTML = o;
  if(selected) mark(selected);
}

/* ---------- the Beacon (gtc.js) ---------- */
/* The beam from Erevos, the kindled arm with its wave of light, and the
   sixteen marker clusters, four to an arm, lit as the wave passes. */
function drawBeacon(){
  const host = document.getElementById("gtc-layer"); if(!host || !window.chartTime) return;
  const st = window.chartTime.state, q = GTC.parts(st.T), f2 = n => n.toFixed(0);
  const ray = (a, r) => [GX.cx + r*Math.cos(a), GX.cy + r*Math.sin(a)*.9];
  const a = GTC.beamAngle(st.T); let o = "";
  const w1 = ray(a-.045, 1800), w2 = ray(a+.045, 1800), tip = ray(a, 1800);
  o += `<path d="M${GX.cx} ${GX.cy} L${f2(w1[0])} ${f2(w1[1])} L${f2(w2[0])} ${f2(w2[1])} Z" fill="#6E95D4" fill-opacity=".12"/>`;
  o += `<line x1="${GX.cx}" y1="${GX.cy}" x2="${f2(tip[0])}" y2="${f2(tip[1])}" stroke="#a8c2ec" stroke-opacity=".4" stroke-width="3"/>`;
  const armPath = (arm, t0, t1) => { let d = ""; for(let t=t0; t<=t1+1e-6; t+=.04){ const p = armPt(arm, Math.min(t,t1)); d += (d?"L":"M") + f2(p[0]) + " " + f2(p[1]); } return d; };
  const front = Math.min(q.front, window.EREVOS.TIP + .2);
  if(q.p < .12){ const prev = (q.arm+3)%4, k = 1 - q.p/.12;
    o += `<path d="${armPath(prev, 0, window.EREVOS.TIP+.15)}" fill="none" stroke="#a8c2ec" stroke-opacity="${(.12*k).toFixed(3)}" stroke-width="60" stroke-linecap="round"/>`; }
  o += `<path d="${armPath(q.arm, 0, front)}" fill="none" stroke="#a8c2ec" stroke-opacity=".1" stroke-width="80" stroke-linecap="round"/>`;
  o += `<path d="${armPath(q.arm, 0, front)}" fill="none" stroke="#a8c2ec" stroke-opacity=".22" stroke-width="20" stroke-linecap="round"/>`;
  o += `<path d="${armPath(q.arm, Math.max(0, front-.35), front)}" fill="none" stroke="#e6eef8" stroke-opacity=".5" stroke-width="30" stroke-linecap="round"/>`;
  const fp = armPt(q.arm, front);
  o += `<circle cx="${f2(fp[0])}" cy="${f2(fp[1])}" r="90" fill="#a8c2ec" fill-opacity=".14"/><circle cx="${f2(fp[0])}" cy="${f2(fp[1])}" r="34" fill="#e6eef8" fill-opacity=".45"/>`;
  window.EREVOS.MARKERS.forEach(m => {
    const lit = m.arm===q.arm && m.t <= q.front, now = lit && m.j===q.marker, [x,y] = m.pos.map(f2);
    o += lit ? `<circle cx="${x}" cy="${y}" r="${now?70:52}" fill="#a8c2ec" fill-opacity="${now?.22:.12}"/><circle cx="${x}" cy="${y}" r="20" fill="#a8c2ec" fill-opacity=".9"/>`
             : `<circle cx="${x}" cy="${y}" r="20" fill="none" stroke="#6E95D4" stroke-opacity=".45" stroke-width="3" stroke-dasharray="5 6"/>`;
    if(now) o += `<text class="lbl-sub" x="${x}" y="${+y-84}" text-anchor="middle" font-size="40" fill="#a8c2ec">kindling ${q.kindling}</text>`;
  });
  if(st.quick){
    const g = GTC.parts(st.T - GTC.QUICK), ga = GTC.beamAngle(st.T - GTC.QUICK), gt = ray(ga, 1800), gp = armPt(g.arm, Math.min(g.front, window.EREVOS.TIP+.2));
    o += `<line x1="${GX.cx}" y1="${GX.cy}" x2="${f2(gt[0])}" y2="${f2(gt[1])}" stroke="#9683c4" stroke-opacity=".7" stroke-width="3" stroke-dasharray="14 12"/>`;
    o += `<circle cx="${f2(gp[0])}" cy="${f2(gp[1])}" r="30" fill="none" stroke="#9683c4" stroke-width="4" stroke-dasharray="6 6"/><text class="lbl-sub" x="${f2(gp[0])}" y="${f2(gp[1]+76)}" text-anchor="middle" font-size="38" fill="#b6a6dc">old tables</text>`;
  }
  host.innerHTML = o;
}

/* ---------- system ---------- */
function bodyFacts(b){
  const rows = [["Designation", b.designation],["Composition", b.composition],["Size", b.size],["Shape", b.shape],
    ["Habitability", b.habitability],["Life", b.life],["Inhabitants", b.inhabitants],["Hazard", b.hazard],["Oddity", b.oddity],["Status", b.status]];
  const r = rows.filter(([,v])=>v).map(([k,v])=>`<dt>${k}</dt><dd>${esc(cap(String(v)))}</dd>`).join("");
  return r ? `<dl class="facts">${r}</dl>` : "";
}
const lived = b => ["civilization","settlement","outpost"].includes(b.inhabitants);
function renderSystem(id){
  const sys = sysById(id);
  if(!sys || (sys.hidden && !hiddenOn())){ renderGalaxy("GAL-01"); intro(); return; }
  view = {level:"system", id, galaxy:sys.galaxy}; canvas = LV.system; registry = {};
  const {cx,cy,R} = LV.system, tone = sys.tone, rec = sys.record;
  let o = backdrop(1400,1400,id.length*17,160);
  o += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="${tone}" fill-opacity=".03" stroke="${tone}" stroke-opacity=".45" stroke-width="2.5" stroke-dasharray="${sys.veiled?"6 12":"12 10"}"/>`;
  o += `<text class="lbl-sub" x="${cx}" y="${cy-R-24}" text-anchor="middle" font-size="26">System edge</text>`;
  o += `<circle cx="${cx}" cy="${cy}" r="48" fill="#e2ae7e" fill-opacity=".18"/><circle cx="${cx}" cy="${cy}" r="17" fill="#ffe3b8"/>`;
  if(sys.haze) o += `<circle cx="${cx}" cy="${cy}" r="${R*.7}" fill="none" stroke="#9678bd" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 10"/>`;
  const primaryN = { id:id+"-primary", name: rec.primary ? cap(rec.primary) : "Primary", kind:"Primary of " + sys.label, parent:sys, primary:true };
  o += `<g ${reg(primaryN.id, primaryN)}><circle cx="${cx}" cy="${cy}" r="50" fill="transparent"/></g>`;
  const orbiting = [], sats = [];
  const bodies = (rec.bodies||[]).map((b,i) => {
    const key = b.name || b.designation;
    const c = sys.hidden ? HIDDEN_BODY : (BODY_CHART[key] || { orbit: .3 + .6*(i+1)/((rec.bodies||[]).length+1), a: (i*137)%360, size:13 });
    const n = Object.assign({}, b, c, { id: id+"/"+slug(key||("body-"+i)), label: b.name || b.designation || (sys.hidden ? "Wayfinders' homeworld" : "Uncharted world"), parent:sys, rec:b });
    (c.of ? sats : orbiting).push(n);
    for(const m of (b.moons||[])){ const mk = m.name || m.designation, mc = BODY_CHART[mk] || {of:key,dx:-40,dy:30,shape:"moon"};
      sats.push(Object.assign({}, m, mc, { id: id+"/"+slug(mk||"moon"), label: mk || "Uncharted moon", parent:sys, rec:m })); }
    return n;
  });
  const orb = id==="Realmspace" ? (b => 80+(R-110)*Math.sqrt(b.d/1600)) : (b => b.orbit*R);
  for(const b of orbiting){ b.r = orb(b); o += `<circle cx="${cx}" cy="${cy}" r="${b.r.toFixed(1)}" fill="none" stroke="${tone}" stroke-opacity=".14" stroke-width="1.5"/>`; }
  for(const b of orbiting){
    const bx = cx+b.r*Math.cos(rad(b.a)), by = cy+b.r*Math.sin(rad(b.a)); b.x=bx; b.y=by;
    const live = lived(b), fill = live?"#33405c":"#1c2434", stroke = live?"#9cc0e0":"#4a6079";
    let g = `<circle cx="${bx}" cy="${by}" r="${Math.max(b.size+18,30)}" fill="transparent"/>`;
    if(b.ring) g += `<ellipse cx="${bx}" cy="${by}" rx="${b.size+14}" ry="5" fill="none" stroke="${stroke}" stroke-opacity=".7" stroke-width="2"/>`;
    if(b.kind==="cluster of floating bodies") g += `<circle cx="${bx-19}" cy="${by+11}" r="5" fill="${fill}" stroke="${stroke}"/><circle cx="${bx+19}" cy="${by-8}" r="5" fill="${fill}" stroke="${stroke}"/>`;
    if(b.star) g += `<path class="sel" d="M${bx} ${by-20} L${bx+5} ${by-5} L${bx+20} ${by} L${bx+5} ${by+5} L${bx} ${by+20} L${bx-5} ${by+5} L${bx-20} ${by} L${bx-5} ${by-5} Z" fill="#e2d2ff" stroke="#9678bd" stroke-width="1.5"/>`;
    else if(b.veiled) g += `<circle class="sel" cx="${bx}" cy="${by}" r="${b.size+8}" fill="#9678bd" fill-opacity=".12" stroke="#9678bd" stroke-width="2.5" stroke-dasharray="5 6"/>`;
    else if(b.shape==="disk") g += `<ellipse class="sel" cx="${bx}" cy="${by}" rx="${b.size+10}" ry="${b.size-4}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
    else g += `<circle class="sel" cx="${bx}" cy="${by}" r="${b.size}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`;
    if(b.prism) g += `<path d="M${bx} ${by-50} L${bx+12} ${by-30} L${bx-12} ${by-30} Z" fill="#fff1d6" stroke="#e2ae7e" stroke-width="2"/>`;
    if(b.mono==="holy") g += `<path d="M${bx-5} ${by-b.size-8} L${bx-4} ${by-b.size-30} L${bx} ${by-b.size-38} L${bx+4} ${by-b.size-30} L${bx+5} ${by-b.size-8} Z" fill="#eef4ff" fill-opacity=".9" stroke="#9cc0e0" stroke-width="1.5"/><circle cx="${bx}" cy="${by-b.size-22}" r="16" fill="#9cc0e0" fill-opacity=".12"/>`;
    if(b.mono==="broken") g += `<path d="M${bx-6} ${by-b.size-8} L${bx-5} ${by-b.size-22} L${bx+1} ${by-b.size-26} L${bx-1} ${by-b.size-18} L${bx+6} ${by-b.size-8} Z" fill="#5f6b7a" stroke="#c08a8a" stroke-width="1.5"/><path d="M${bx+8} ${by-b.size-34} l6 -4 l2 6 Z" fill="#5f6b7a" stroke="#c08a8a" stroke-width="1"/>`;
    const shown = b.label.length>34 ? "Wardrobe feature" : b.label;
    g += `<text class="lbl" x="${bx}" y="${by-b.size-(b.prism||b.mono?48:18)}" text-anchor="middle" font-size="${shown.length>22?20:28}">${esc(shown)}</text>`;
    if(b.designation && b.name) g += `<text class="lbl-sub" x="${bx}" y="${by+b.size+30}" text-anchor="middle" font-size="20">${esc(b.designation)}</text>`;
    o += `<g ${reg(b.id,b)}>${g}</g>`;
  }
  for(const s of sats){
    const p = orbiting.find(b=>(b.name||b.designation)===s.of); if(!p) continue;
    const sx=p.x+s.dx, sy=p.y+s.dy;
    const glyph = s.shape==="diamond" ? `<path class="sel" d="M${sx-12} ${sy} L${sx} ${sy-15} L${sx+12} ${sy} L${sx} ${sy+15} Z" fill="#c08652" stroke="#e2ae7e" stroke-width="2"/>`
      : s.shape==="moon" ? `<circle class="sel" cx="${sx}" cy="${sy}" r="7" fill="#2a3346" stroke="#9cc0e0" stroke-width="2"/>`
      : `<rect class="sel" x="${sx-11}" y="${sy-11}" width="22" height="22" rx="3" fill="#3a3024" stroke="#e2ae7e" stroke-width="2"/>`;
    o += `<line x1="${p.x}" y1="${p.y}" x2="${sx}" y2="${sy}" stroke="#9cc0e0" stroke-opacity=".45" stroke-dasharray="3 5" stroke-width="1.5"/>`;
    const right = s.dx > 0;
    o += `<g ${reg(s.id,s)}><circle cx="${sx}" cy="${sy}" r="28" fill="transparent"/>${glyph}<text class="lbl" x="${right?sx+20:sx-16}" y="${sy+9}" font-size="22" text-anchor="${right?"start":"end"}">${esc(s.label)}</text></g>`;
  }
  /* exits along the lanes */
  if(sys.galaxy==="GAL-01"){ placeLaneSites();
    const exits = LANES.filter(l=>l.a===id||l.b===id).map(l=>{
      const other = l.a===id ? l.b : l.a, stop = l.split ? l.split : other, g = laneGeom(l), [qx,qy] = qpt(g, l.a===id?.06:.94);
      return { ang:Math.atan2(qy-sys.y, qx-sys.x), target:galNode(stop), tier: l.split && l.b===id ? "long" : l.tier };
    }).sort((a,b)=>a.ang-b.ang);
    exits.forEach((e,i)=>{ e.dy = (i>0 && Math.abs(e.ang-exits[i-1].ang)<.22) ? (exits[i-1].dy||0)+34 : 0; });
    for(const e of exits){
      const px=cx+R*Math.cos(e.ang), py=cy+R*Math.sin(e.ang), lx=cx+(R+44)*Math.cos(e.ang), ly=cy+(R+44)*Math.sin(e.ang);
      const anchor = Math.cos(e.ang)>.3?"start":Math.cos(e.ang)<-.3?"end":"middle", col = e.tier==="closed"?"#d07070":"#e2ae7e";
      o += `<g class="node" data-exit="${esc(e.target.id)}" tabindex="0" role="button" aria-label="Route to ${esc(title(e.target))}"><circle cx="${px}" cy="${py}" r="34" fill="transparent"/><path d="M-12 -11 L8 0 L-12 11" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(e.ang*180/Math.PI).toFixed(1)})" fill="none" stroke="${col}" stroke-width="3.5"/><text class="lbl-sub" x="${lx.toFixed(1)}" y="${(ly+9+e.dy).toFixed(1)}" text-anchor="${anchor}" font-size="26">To ${esc(title(e.target))}</text></g>`;
    }
  }
  svg.innerHTML = o;
  legend(`<span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#33405c" stroke="#9cc0e0" stroke-width="1.5"/></svg>Someone lives here</span>
    <span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#1c2434" stroke="#4a6079" stroke-width="1.5"/></svg>No one lives here</span>
    <span>Chevrons on the edge mark where routes leave the system.</span>`);
  crumbs([["Rykoe Cosmos","cosmos"],[sys.galaxy,"galaxy"],[sys.label,null]]); controls(); tray(false); fit();
  showNode(sys,false);
}

let vb = {x:0,y:0,w:1000,h:1000};
function aspect(){ const r = svg.getBoundingClientRect(); return r.height/r.width || 1; }
function apply(){ vb.h = vb.w*aspect(); svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function frame(cx,cy,w){ const h = w*aspect(); vb = {x:cx-w/2,y:cy-h/2,w,h}; apply(); }
let pendingFit = false;
function fit(){ if(!svg.getBoundingClientRect().width){ pendingFit = true; return; } pendingFit = false; const a = aspect(), pad = view.level==="system" ? 180 : 60; let w = canvas.W+pad*2, h = w*a; if(h < canvas.H+pad*2){ h = canvas.H+pad*2; w = h/a; } frame(canvas.W/2, canvas.H/2, w); }
function zoomAt(f,px,py){ const nw = Math.min(Math.max(vb.w*f, canvas.W*.08), canvas.W*2.4), k = nw/vb.w; vb.x = px-(px-vb.x)*k; vb.y = py-(py-vb.y)*k; vb.w = nw; apply(); }
function toUnits(x,y){ const r = svg.getBoundingClientRect(); return [vb.x+(x-r.left)/r.width*vb.w, vb.y+(y-r.top)/r.height*vb.h]; }
const pointers = new Map(); let moved = 0, pinch0 = null;
svg.addEventListener("pointerdown", e=>{ pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved = 0; if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch0 = {d:Math.hypot(a.x-b.x,a.y-b.y), w:vb.w}; } });
window.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId), r = svg.getBoundingClientRect(); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ const dx=e.clientX-prev.x, dy=e.clientY-prev.y; moved += Math.abs(dx)+Math.abs(dy); if(moved>6){ svg.classList.add("dragging"); vb.x -= dx/r.width*vb.w; vb.y -= dy/r.height*vb.h; apply(); } }
  else if(pointers.size===2 && pinch0){ const [a,b]=[...pointers.values()], d=Math.hypot(a.x-b.x,a.y-b.y), [ux,uy]=toUnits((a.x+b.x)/2,(a.y+b.y)/2); zoomAt((pinch0.w*pinch0.d/d)/vb.w,ux,uy); moved = 99; }
});
const endPtr = e=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinch0=null; if(!pointers.size) svg.classList.remove("dragging"); };
window.addEventListener("pointerup", endPtr); window.addEventListener("pointercancel", endPtr);
svg.addEventListener("wheel", e=>{ e.preventDefault(); const [ux,uy]=toUnits(e.clientX,e.clientY); zoomAt(Math.exp(e.deltaY*.0015),ux,uy); }, {passive:false});
document.getElementById("zin").onclick = ()=>zoomAt(.7, vb.x+vb.w/2, vb.y+vb.h/2);
document.getElementById("zout").onclick = ()=>zoomAt(1/.7, vb.x+vb.w/2, vb.y+vb.h/2);
document.getElementById("zfit").onclick = fit;

function heartsCount(){
  const found = HEARTS.filter(h=>h.state!=="unknown").length, opened = HEARTS.filter(h=>h.state==="linked").length;

}
function showHeart(h){
  const st = HSTATE[h.state], iris = h.part==="iris";
  const partName = { upper:"Upper lid", lower:"Lower lid", iris:"Iris" }[h.part];
  const role = iris ? `An iris world. The iris closes the binding circle around the core, and its worlds are key: lose one and the iris must be redrawn, a real setback but not the end.`
                    : `A lid world. Lid worlds can be replaced: a lost stroke can be redrawn through another Monolith world near it, at a cost of years.`;
  const stateText = { linked:`One of two neighbouring systems on the upper lid, each with a Monolith world. The two hearts are opened and linked to each other, Atrium to Atrium, and each is linked to Oerth's.`,
    found:`Nowhere. A lesser god forced its way into this system and down onto the world, and the push destroyed both. A Monolith answered. The world's heart lies exposed in the wreck: found, and not yet opened.`,
    unknown:`A Monolith world, chosen from thousands for how it looks from Oerth. Nothing is known of its heart.` }[h.state];
  const height = h.height > 1 ? "a little above the galaxy's plane" : h.height < -1 ? "a little below the galaxy's plane" : "close to the galaxy's plane";
  const dm = [];
  if(h.src.sys) dm.push(`Its system is a survey.js roll, seed ${h.src.sys.seed}; keep it with <code>node scripts/survey.js roll --seed ${h.src.sys.seed} --save</code> when it matters.`);
  if(h.state==="linked") dm.push(`One of the two opened worlds is a little-charted planet the crew learns of late in the campaign.`);
  if(h.state==="found") dm.push(`Its exposed heart is the easiest in the galaxy to open, which is why Vecna chose it.`);
  else dm.push(`Which world this is gets decided when it matters. Vecna's progress here is tracked as counts: hearts found, opened and linked.`);
  dm.push(`Like every heart in the figure, it links back to Oerth's heart as well as to its neighbours in the ${iris?"iris":"lid"}.`);
  const sys = h.src.sys;
  panel.innerHTML = `<h2>${h.state==="found"?"Nowhere":"Heart world"}</h2><p class="kind">Inscription · ${partName} · ${h.n}${sys ? " · " + esc(sys.id) : ""}</p>
    ${st.badge ? `<span class="badge ${st.badge}">${st.label}</span>` : `<span class="badge">${st.label}</span>`}${iris?`<span class="badge b-red">Key</span>`:`<span class="badge">Replaceable</span>`}
    <p>${stateText}</p>${sys && h.state==="unknown" ? `<p>${esc(h.src.summary)}</p>` : ""}<p>${role}</p><p class="hint">Its system lies ${height}, inside the disc.</p>${dmlist(dm)}`;

  if(b.dataset.crumb==="cosmos") renderCosmos(); else renderGalaxy(view.galaxy||"GAL-01"); intro(); });
function toggle(btn, label, on){ btn.setAttribute("aria-pressed", on); btn.textContent = `${label}: ${on?"on":"off"}`; }
document.getElementById("toggleHidden").addEventListener("click", e=>{ const on = !pressed("toggleHidden"); toggle(e.currentTarget, "Hidden layer", on); document.querySelector(".chart").classList.toggle("hidden-off", !on);
  if(!on){ const hid = n => n && (n.hidden || (n.parent && n.parent.hidden));
    if(view.level==="system" && sysById(view.id).hidden){ selected = null; renderGalaxy("GAL-01"); intro(); }
    else if(hid(registry[selected])){ selected = null; mark(null); intro(); } } });
/* Labels and the Monolith icon: shown by default, remembered per browser. */
const PREF = { get(k){ try { return localStorage.getItem("caelestis_chart_" + k); } catch(e) { return null; } },
               set(k, v){ try { localStorage.setItem("caelestis_chart_" + k, v); } catch(e) {} } };
[["toggleLabels","Labels","labels-off","labels"],["toggleMono","Monolith","mono-off","monolith"]].forEach(([id, word, cls, key]) => {
  const btn = document.getElementById(id), chart = document.querySelector(".chart");
  const set = on => { toggle(btn, word, on); chart.classList.toggle(cls, !on); };
  set(PREF.get(key) !== "off");
  btn.addEventListener("click", () => { const on = !pressed(id); set(on); PREF.set(key, on ? "on" : "off"); });
});
document.getElementById("toggleBeacon").addEventListener("click", e=>{ const on = !pressed("toggleBeacon"); toggle(e.currentTarget, "Beacon", on); document.querySelector(".chart").classList.toggle("beacon-off", !on); galaxyLegend(); });
document.getElementById("toggleCon").addEventListener("click", e=>{ const on = !pressed("toggleCon"); toggle(e.currentTarget, "Constellations", on); document.querySelector(".chart").classList.toggle("con-off", !on); });
document.getElementById("toggleIns").addEventListener("click", e=>{ const on = !insOn(); toggle(e.currentTarget, "Inscription", on); document.querySelector(".chart").classList.toggle("ins-off", !on);
  if(!on && HEARTS.some(h=>h.id===selected)){ selected = null; mark(null); intro(); }
  galaxyLegend(); });
/* ---------- the two views ---------- */
/* The 3D view is holo.html in a frame, loaded the first time it is opened
   and paused while the flat chart is showing. Deep links: index.html#3d
   opens it, index.html#3d-oerth plays the view from Oerth. */
const shell = document.getElementById("chart"), holo = document.getElementById("holo");
let current = "2d", holoReady = false;
function holoSend(msg){ if(holoReady && holo.contentWindow) holo.contentWindow.postMessage(msg, location.origin); }
/* ---------- the clock ---------- */
/* One clock for both views: it redraws the flat chart's Beacon and hands
   the time to the holochart in its frame. */
window.chartTime = (() => {
  let ctl = null;
  const push = () => { if(ctl) holoSend({ gtc:{ T:ctl.state.T, quick:ctl.state.quick } }); };
  const api = { get state(){ return ctl.state; }, push, view(){ push(); } };
  window.chartTime = api;
  ctl = GTC.mount(document.getElementById("gtc"), { onTime(){ if(current==="2d") drawBeacon(); else push(); } });
  return api;
})();

function showView(v, at){
  current = v;
  document.querySelectorAll(".view-switch [role=tab]").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view===v)));
  document.getElementById("view-2d").hidden = v!=="2d";
  document.getElementById("view-3d").hidden = v!=="3d";
  shell.classList.toggle("is-3d", v==="3d");
  if(v==="3d"){
    if(!holo.getAttribute("src")) holo.setAttribute("src", "holo.html" + (at ? "#" + at : ""));
    else { holoSend({ cmd:"resume" }); if(at) holoSend({ cmd:at }); }
  } else { holoSend({ cmd:"pause" }); if(pendingFit) fit(); else apply(); }
  const hash = v==="3d" ? (at ? "#3d-" + at : "#3d") : "";
  try { history.replaceState(null, "", location.pathname + location.search + hash); } catch(e) {}
  if(window.chartTime) window.chartTime.view(v);
}
holo.addEventListener("load", () => { holoReady = true; if(window.chartTime) window.chartTime.push(); });
document.querySelector(".view-switch").addEventListener("click", e => { const t = e.target.closest("[data-view]"); if(t && t.dataset.view!==current) showView(t.dataset.view); });
document.querySelector(".view-switch").addEventListener("keydown", e => {
  if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
  const v = current==="2d" ? "3d" : "2d"; showView(v); document.getElementById("tab-"+v).focus(); });
document.getElementById("toggleOerth").addEventListener("click", () => showView("3d", "oerth"));
function fromHash(){ const m = /^#3d(?:-(oerth))?$/.exec(location.hash); if(m) showView("3d", m[1]); }
window.addEventListener("hashchange", fromHash);
fromHash();
const chips = document.getElementById("chips");
chips.innerHTML = UNPLACED.map(u=>`<button type="button" class="chip" data-chip="${u.id}">${esc(u.name)}</button>`).join("");
chips.addEventListener("click", e=>{ const c = e.target.closest(".chip"); if(!c) return; const u = UNPLACED.find(x=>x.id===c.dataset.chip); mark(u.id);
  panel.innerHTML = `<h2>${esc(u.name)}</h2><p class="kind">${esc(u.kind)}</p><p>${u.summary}</p>`; if(innerWidth<980) panel.scrollIntoView({block:"start"}); });

fetch(SURVEY_URL).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(sv => { buildFromSurvey(sv); renderCosmos(); intro(); })
  .catch(() => { panel.innerHTML = `<h2>The Rykoe Cosmos</h2><p>The survey (prime/data/survey.json) could not be read, so the chart has nothing to draw. Open this page through the site rather than from a file.</p>`; });
</script>
</body>
</html>
