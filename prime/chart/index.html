<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:18px;line-height:1.5}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;padding:1rem 1rem .6rem;max-width:1400px;margin:0 auto}
h1{font-family:var(--display);font-weight:600;font-size:1.35rem;letter-spacing:.06em;margin:0;color:var(--gold-l)}
.sub-h{flex:1 1 auto;color:var(--muted);font-size:1rem;min-width:10rem}
.btn{font-family:var(--serif);font-size:.95rem;color:var(--text);background:var(--raised);border:1px solid var(--rule);border-radius:4px;padding:.35rem .75rem;cursor:pointer;min-height:38px}

@media (min-width:980px){.layout{grid-template-columns:minmax(0,1fr) 380px;align-items:start}.panel{position:sticky;top:1rem;max-height:92vh;overflow:auto}}
.chart{position:relative;background:#070a12;border:1px solid rgba(130,168,210,.18);border-radius:6px;overflow:hidden}
#map{display:block;width:100%;height:78vh;min-height:520px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
@media (min-width:980px){#map{height:88vh}}
.zoom{position:absolute;top:.6rem;right:.6rem;display:flex;flex-direction:column;gap:.35rem}
.zoom .btn{background:rgba(20,28,43,.9);color:#e4ebf5;border-color:rgba(130,168,210,.3);min-width:42px;min-height:42px;font-size:1.15rem;padding:0 .6rem}

.legend svg{width:34px;height:10px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:1rem 1.1rem 1.2rem}
.panel h2{font-family:var(--display);font-weight:600;font-size:1.25rem;letter-spacing:.04em;margin:.1rem 0 .35rem}
.kind{color:var(--muted);font-size:1rem;margin:0 0 .6rem}
.badge{display:inline-block;font-size:.85rem;border-radius:3px;padding:.05rem .5rem;margin:0 .35rem .35rem 0;border:1px solid var(--rule)}
.b-canon{color:var(--ice-l);border-color:var(--ice)}
.b-draft{color:var(--gold-l);border-color:var(--gold)}
.b-open{color:var(--red);border-color:var(--red)}
.b-hidden{color:var(--violet);border-color:var(--violet)}
.panel h3{font-weight:500;font-size:1rem;color:var(--gold-l);margin:1rem 0 .25rem}

.panel ul{margin:.2rem 0 .4rem;padding-left:1.1rem;color:var(--soft)}
.panel li{margin:.15rem 0}
.panel .act{margin-top:.8rem;width:100%;border-color:var(--gold);color:var(--gold-l);font-size:1rem}
.hint{color:var(--muted);font-style:italic}
.tray{max-width:1400px;margin:0 auto;padding:0 1rem 2.5rem}
.tray h2{font-family:var(--display);font-weight:500;font-size:1rem;letter-spacing:.05em;color:var(--muted);margin:0 0 .5rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{font-family:var(--serif);font-size:.95rem;background:var(--raised);color:var(--soft);border:1px dashed var(--rule);border-radius:999px;padding:.3rem .8rem;cursor:pointer;min-height:38px}
.chip.is-selected{border-style:solid;border-color:var(--gold);color:var(--text)}
.node{cursor:pointer}
.lbl{font-family:var(--display);font-weight:500;fill:#c6d2e2;letter-spacing:.03em;paint-order:stroke;stroke:#070a12;stroke-width:6px;stroke-linejoin:round}
.lbl-sub{font-family:var(--serif);font-style:italic;fill:#8797ad;paint-order:stroke;stroke:#070a12;stroke-width:6px;stroke-linejoin:round}
.node:hover .lbl,.node.is-selected .lbl{fill:#e2ae7e}
.node.is-selected .sel{stroke:#e2ae7e;stroke-opacity:1;stroke-width:4}
.hidden-layer{transition:opacity .25s}
.hidden-off .hidden-layer{opacity:0;pointer-events:none}
.con-off .con-layer{opacity:0;pointer-events:none}
.fig-off .fig-layer{opacity:0;pointer-events:none}
.fig-layer{transition:opacity .25s}
.con-layer{transition:opacity .25s}
@media (prefers-reduced-motion: reduce){.hidden-layer{transition:none}}
.crumbs button{font:inherit;color:var(--ice-l);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dmbox{border:1px solid var(--violet);border-left-width:3px;background:rgba(150,120,189,.09);padding:.5rem .8rem .2rem;margin:1rem 0;border-radius:3px}
.dmbox h3{color:var(--violet);margin-top:.3rem}
</style>

  sites: [
    { id:"waystation", name:"Astral waystation", r:34, icon:"waystation", onLane:["rs","vs"], t:.55, status:["draft"], kind:"Wildspace site, trade post",

    { id:"tetherbreak", name:"Tetherbreak sector", x:330, y:2160, r:250, icon:"region", status:["canon","draft","open"], kind:"Wildspace region, restricted",
      summary:`Fleet sector under elevated monitoring. The run past Strake Station is closed by standing order SA-005.`, travel:`The Tetherbreak approach lane runs from Realmspace along the sphere's edge to Strake Station, which is open. Everything beyond Strake is closed without Bridge authorization.`,
      there:[`Strake Station — operational, crewed, and the authorized limit of the bearing. It holds the only staged copies of the Cairn approach packet: charts, survey material, and timing tables.`,`Cairn Station — silent for a year, after reporting a mass signature that read differently on every sweep. Nobody has been back.`,`The Bellwether Crow — relief vessel, mauled on the edge run past Strake and turned back short of Cairn. It made Strake under damage and reached Fleet anchorage days late with a fraction of its complement.`,`M. Tarroway — Strake's station cartographer, who keeps the approach packet and is still revising it.`],
      dm:[`Vth'oramu was at Cairn. That is the signature in Cairn's final transmission, and the readings made no sense because the thing on the scope was not a vessel.`,`Vocath's people took Cairn after it went dark and waited there, because a silent Fleet station guarantees a relief run on a single predictable bearing. The ambush was the point of holding the position.`,`Tarroway's timing tables have been failing for cycles. He has been revising a patrol table for something that was never keeping a patrol.`],

      there:[`The staged Cairn approach packet: charts, survey material, and timing tables. The only copies in the sector.`,`Quartermaster Halix Verrow, who counter-signs everything that moves on this bearing.`,`M. Tarroway, station cartographer, who has revised the approach packet three times in a cycle because the readings behind it keep moving.`,`A secure-storage item held indefinitely, with contents classified above the filing's clearance.`],
      dm:[`Strake is the crew's natural staging point and the last friendly deck before anything happens. Everyone who went out went through here, and everyone who came back came back through here.`,`Tarroway is a live NPC with a real problem: a packet he cannot make hold. He does not know the thing it tracked has gone.`],

    { id:"crow", name:"Bellwether Crow engagement", r:26, icon:"incident", onLane:["strake","cairn"], t:.78, status:["canon","draft"], kind:"Incident site, Tetherbreak approach lane",
      summary:`The relief vessel The Bellwether Crow was engaged here, on the edge run out from Strake Station toward Cairn, by a small, fast craft marked with an eye inside a wheel. Crewmate Clint Dashforest took the boarders\u0027 craft and broke away with it, drawing their pursuit off the Crow.`,
      there:[`Clint Dashforest, a Caelestis crewmate, went from here into SYS-04 in the craft he took and reached W-21: Fonains, where he brought laser pistols into that world. How he crossed is undecided.`,`A second boarding action followed shortly after, by the same craft or one like it. The senior deck officers and most of the complement were lost. The Crow broke off under damage, came about, made Strake Station and reached Fleet anchorage days behind schedule with survivors and a debrief.`,`Crewmate Joffrey held the survivors together through the withdrawal and brought them off the deck alive. He was decorated on their unanimous account and posted to Caelestis.`,`Survivor accounts of the second action differ in detail and agree on the outcome.`],
      dm:[`Joffrey was taken in the second action. The decoration is real in the sense that the survivors believe every word of it — they were allowed to live so that there would be a story, and he was made its hero.`,`The ambush was waiting. Vocath's people held Cairn and knew a relief run had to come out on this bearing. The first boarding was them doing what they came for.`,`Clint seizing their craft is the part nobody planned, and it is why the second action happened at all.`],
      open:[`How Clint Dashforest reached Fonains.`] }

function backdrop(W,H,seed,count){
  const S = Math.max(W,H), ox = W/2-S*2.5, oy = H/2-S*2.5*0.667;
  let o = `<defs>
    <radialGradient id="g-home" cx="42%" cy="38%" r="70%"><stop offset="0%" stop-color="#9fe9e1"/><stop offset="55%" stop-color="#2f8f8c"/><stop offset="100%" stop-color="#12383f" stop-opacity=".85"/></radialGradient>
    <radialGradient id="g-other" cx="42%" cy="38%" r="70%"><stop offset="0%" stop-color="#d9b8e8"/><stop offset="55%" stop-color="#7a4f93"/><stop offset="100%" stop-color="#2a1838" stop-opacity=".85"/></radialGradient>
    <radialGradient id="g-godless" cx="42%" cy="38%" r="70%"><stop offset="0%" stop-color="#d8d4ce"/><stop offset="55%" stop-color="#6e6a66"/><stop offset="100%" stop-color="#262422" stop-opacity=".85"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="28"/></filter>
    <radialGradient id="g-hole"><stop offset="0%" stop-color="#000000"/><stop offset="55%" stop-color="#05030a"/><stop offset="72%" stop-color="#f0a0c8" stop-opacity=".55"/><stop offset="84%" stop-color="#8fe8df" stop-opacity=".25"/><stop offset="100%" stop-color="#8fe8df" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-core"><stop offset="0%" stop-color="#fff6e6"/><stop offset="35%" stop-color="#ffd9a8" stop-opacity=".9"/><stop offset="100%" stop-color="#ffd9a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-halo"><stop offset="55%" stop-color="#3fb7b0" stop-opacity=".28"/><stop offset="100%" stop-color="#3fb7b0" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-halo2"><stop offset="55%" stop-color="#c05aa0" stop-opacity=".22"/><stop offset="100%" stop-color="#c05aa0" stop-opacity="0"/></radialGradient>
  </defs>`;
  o += `<rect x="${W/2-S*3}" y="${H/2-S*3}" width="${S*6}" height="${S*6}" fill="#05060d"/>`;
  o += `<image href="${ASTRAL}" x="${ox}" y="${oy}" width="${S*5}" height="${S*5*0.667}" preserveAspectRatio="none"/>`;
  o += `<rect x="${W/2-S*3}" y="${H/2-S*3}" width="${S*6}" height="${S*6}" fill="#05060d" fill-opacity=".42"/>`;
  let s = seed; const rnd = () => (s=(s*9301+49297)%233280)/233280;
  for(let i=0;i<count*3;i++) o += `<circle cx="${(W/2-S*1.5+rnd()*S*3).toFixed(0)}" cy="${(H/2-S*1.5+rnd()*S*3).toFixed(0)}" r="${(rnd()<.92?1.2+rnd()*1.6:3+rnd()*2).toFixed(1)}" fill="#eef6ff" opacity="${(.2+rnd()*.5).toFixed(2)}"/>`;
  return o;
}
function reg(id,n){ registry[id]=n; return `class="node" data-id="${id}" tabindex="0" role="button" aria-label="${esc(title(n))}"`; }

/* ---------- cosmos ---------- */
function renderCosmos(){
  view = {level:"cosmos"}; canvas = LV.cosmos; registry = {};
  let o = backdrop(canvas.W, canvas.H, 5, 500);
  o += `<text class="lbl-sub" x="120" y="150" font-size="52">The Astral Sea</text>`;
  for(let r=520;r<=1500;r+=260) o += `<circle cx="${CEN.x}" cy="${CEN.y}" r="${r}" fill="none" stroke="#f0a0c8" stroke-opacity=".08" stroke-width="3" stroke-dasharray="2 22"/>`;
  const c = DATA.center;
  o += `<g ${reg("center",c)}><circle cx="${CEN.x}" cy="${CEN.y}" r="210" fill="transparent"/>
    <circle cx="${CEN.x}" cy="${CEN.y+20}" r="230" fill="#c05aa0" fill-opacity=".18" filter="url(#softer)"/>
    <circle class="sel" cx="${CEN.x}" cy="${CEN.y+20}" r="120" fill="url(#g-hole)"/>
    <circle cx="${CEN.x}" cy="${CEN.y+20}" r="58" fill="#000" filter="url(#soft)"/>
    <circle cx="${CEN.x}" cy="${CEN.y-130}" r="90" fill="url(#g-core)"/>
    <path d="M${CEN.x-16} ${CEN.y-70} L${CEN.x-13} ${CEN.y-172} L${CEN.x} ${CEN.y-196} L${CEN.x+13} ${CEN.y-172} L${CEN.x+16} ${CEN.y-70} Z" fill="#fff6e6" fill-opacity=".92" stroke="#ffd9a8" stroke-width="2"/>
    <line x1="${CEN.x}" y1="${CEN.y-168}" x2="${CEN.x}" y2="${CEN.y-84}" stroke="#c08652" stroke-opacity=".55" stroke-width="2"/>
    <text class="lbl" x="${CEN.x}" y="${CEN.y+200}" text-anchor="middle" font-size="58">The center</text></g>`;
  o += `<g class="fig-layer">` + (function(){
    const pos = new Map(NODES.map(n=>[n.id, nodePos(n)]));
    const intended = FIG_MODE === "intended";
    const done = n => n.status === "claimed";
    let d = "";
    for(const r of [1420, 1330])
      d += `<circle cx="${CEN.x}" cy="${CEN.y}" r="${r}" fill="none" stroke="#e2ae7e" stroke-opacity="${intended?.22:.12}" stroke-width="2"/>`;
    for(const [a,b,kind] of nodeEdges()){
      const live = done(a) && done(b);
      if(!intended && !live) continue;
      const p = pos.get(a.id), q = pos.get(b.id);
      const mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2;
      let ox = mx-CEN.x, oy = my-CEN.y, ol = Math.hypot(ox,oy);
      if(ol < 80){ ox = -(q[1]-p[1]); oy = q[0]-p[0]; ol = Math.hypot(ox,oy) || 1; }
      const push = kind === "inner" ? 90 : 420;
      const cx = mx + ox/ol*push, cy = my + oy/ol*push;
      const op = intended ? (live ? .75 : .38) : .75;
      const dash = intended && !live ? "6 16" : "";
      d += `<path d="M${p[0].toFixed(0)} ${p[1].toFixed(0)} Q${cx.toFixed(0)} ${cy.toFixed(0)} ${q[0].toFixed(0)} ${q[1].toFixed(0)}" fill="none" stroke="#e2ae7e" stroke-opacity="${op}" stroke-width="${live?4:2.5}" stroke-dasharray="${dash}"/>`;
    }
    for(const n of NODES.filter(x=>x.coreBound)){
      if(!intended) continue;                       // the Core links are never closed yet
      const p = pos.get(n.id);
      d += `<line x1="${p[0].toFixed(0)}" y1="${p[1].toFixed(0)}" x2="${CEN.x}" y2="${CEN.y}" stroke="#c9b3ea" stroke-opacity=".3" stroke-width="2.5" stroke-dasharray="4 18"/>`;
    }
    d += NODES.map(n=>{
      const p = pos.get(n.id), s = DATA.spheres.find(z=>z.id===n.sphere);
      if(!intended && !done(n)) return "";
      const away = Math.atan2(p[1]-s.y, p[0]-s.x);
      const lx = p[0] + 34*Math.cos(away), ly = p[1] + 34*Math.sin(away);
      const anchor = Math.cos(away) > .3 ? "start" : Math.cos(away) < -.3 ? "end" : "middle";
      const col = intended ? "#e2ae7e" : NODE_COLOR[n.status];
      return `<g class="node" data-fig="${n.id}" tabindex="0" role="button" aria-label="${esc(n.label)}">
        <circle cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="34" fill="transparent"/>
        ${n.coreBound ? `<circle cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="27" fill="none" stroke="#c9b3ea" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 5"/>` : ""}
        <circle cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="19" fill="none" stroke="${col}" stroke-opacity=".75" stroke-width="2"/>
        <circle cx="${p[0].toFixed(0)}" cy="${p[1].toFixed(0)}" r="11" fill="${intended ? (done(n) ? "#e2ae7e" : "none") : col}" stroke="${col}" stroke-width="2"/>
        <text class="lbl" x="${lx.toFixed(0)}" y="${(ly+10).toFixed(0)}" text-anchor="${anchor}" font-size="30" fill="${col}">${esc(n.label)}</text></g>`;
    }).join("");
    return d;
  })() + `</g>`;
  for(const s of DATA.spheres){
    const r = s.home ? 130 : 100, grad = s.godless ? "g-godless" : s.home ? "g-home" : "g-other", halo = s.home ? "g-halo" : "g-halo2";
    o += `<g ${reg(s.id,s)}><circle cx="${s.x}" cy="${s.y}" r="${r*2.2}" fill="url(#${halo})"/>
      <circle cx="${s.x}" cy="${s.y}" r="${r*1.02}" fill="url(#${grad})" filter="url(#soft)"/>
      <circle class="sel" cx="${s.x}" cy="${s.y}" r="${r}" fill="url(#${grad})" stroke="none"/>
      <text class="lbl" x="${s.x}" y="${s.y-r-34}" text-anchor="middle" font-size="${s.home?62:50}">${esc(s.label)}</text>
      <text class="lbl-sub" x="${s.x}" y="${s.y+r+50}" text-anchor="middle" font-size="34" fill="${NODES.filter(n=>n.sphere===s.id&&n.status==="claimed").length>=3?"#d07070":"#b9a5d8"}">${NODES.filter(n=>n.sphere===s.id&&n.status==="claimed").length} / 3 nodes</text></g>`;
  }
  svg.innerHTML = o;
  legend(`<span>${FIG_MODE==="intended" ? "The figure as it must be drawn. Faint strokes are unfinished." : "Only what is finished: closed nodes and the links between them."}</span>` + Object.entries(NODE_LABEL).map(([k,v])=>`<span><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="${NODE_COLOR[k]}"/></svg>${v}</span>`).join(""));
  crumbs([["Cosmos",null]]); tray(false); fit();
}

/* ---------- sphere ---------- */
function systemGlyph(s){
  const {x,y,tone} = s; let g = "";
  g += `<circle cx="${x}" cy="${y}" r="${SR}" fill="${tone}" fill-opacity="${s.veiled||s.uncharted?.03:.06}"/>`;

let vb = {x:0,y:0,w:1000,h:1000};
function aspect(){ const r = svg.getBoundingClientRect(); return r.height/r.width || 1; }

svg.addEventListener("pointerdown", e=>{ pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved = 0; if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch0 = {d:Math.hypot(a.x-b.x,a.y-b.y), w:vb.w}; } });

  else if(pointers.size===2 && pinch0){ const [a,b]=[...pointers.values()], d=Math.hypot(a.x-b.x,a.y-b.y), [ux,uy]=toUnits((a.x+b.x)/2,(a.y+b.y)/2); zoomAt((pinch0.w*pinch0.d/d)/vb.w,ux,uy); moved = 99; }

    ${isSph && figNodes.length ? `<h3>Figure nodes</h3><ul>${figNodes.map(x=>`<li><span style="color:${NODE_COLOR[x.status]}">&#9679;</span> ${esc(x.label)} &mdash; ${NODE_LABEL[x.status]}</li>`).join("")}</ul>` : ""}
    ${isSph ? `<h3>Working progress</h3><p>${linkLine(n.id)}. A node is a system with three primed worlds; a sphere is ready at three nodes.</p>` : ""}
    ${isSph ? `<h3>Systems</h3><p>${systemsOf(n.id).length} systems, ${systemsOf(n.id).reduce((a,s)=>a+s.bodies.length,0)} charted worlds.</p>` : ""}
    ${dmlist(n.dm)}${list("Open", n.open===true?[]:n.open)}${btn}`;
}
function intro(){ panel.innerHTML = `<h2>Caelestis cosmos</h2><p class="kind">DM chart</p><p>Three levels: the cosmos, a sphere, a system. Designations follow Caelestis's charting; names follow after a colon when known.</p><p class="hint">Tap anything for details. Tap a sphere or system twice to open it.</p>`; }

function activate(g){
  if(g.dataset.up){ const sp = view.sphere||"sph01"; renderCosmos(); show(sp); return; }
  if(g.dataset.fig){ showFigure(nodeOf(g.dataset.fig)); return; }
  if(g.dataset.exit){ const id = g.dataset.exit; renderSphere("sph01"); show(id); const n = sphNode(id); frame(n.x,n.y,1800); return; }
  show(g.dataset.id);
}
function show(id){
  const n = registry[id]; if(!n) return;
  if(selected===id){ if(view.level==="cosmos" && DATA.spheres.some(s=>s.id===id)){ renderSphere(id); return; } if(view.level==="sphere" && sysById(id)){ renderSystem(id); return; } }
  mark(id);
  if(n.parent){ const fg = figureOf(n.id);
    panel.innerHTML = `<h2>${esc(n.name)}</h2><p class="kind">${esc(n.kind)}${n.d?`, ${n.d.toLocaleString()} million miles out`:""}</p>${badges(n.status||["canon"])}
      ${n.mono?`<p><strong>A Monolith stands here.</strong></p>`:""}
      ${fg?`<p><span class="badge" style="color:${NODE_COLOR[fg.status]};border-color:${NODE_COLOR[fg.status]}">Figure node &mdash; ${NODE_LABEL[fg.status]}</span></p>`:""}
      <p>${n.note}</p>${list("Open",n.open)}`; return; }
  showNode(n, true);
}
svg.addEventListener("click", e=>{ if(moved>6) return; const g = e.target.closest(".node"); if(g) activate(g); });
svg.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("node")){ e.preventDefault(); activate(e.target); } });
panel.addEventListener("click", e=>{ const b = e.target.closest("[data-go]"); if(!b) return; selected = null;
  if(b.dataset.go.startsWith("sph:")) renderSphere(b.dataset.go.slice(4)); else renderSystem(b.dataset.go);
  if(innerWidth<980) svg.scrollIntoView({block:"start"}); });
document.getElementById("crumbs").addEventListener("click", e=>{ const b = e.target.closest("[data-crumb]"); if(!b) return; selected = null; if(b.dataset.crumb==="cosmos") renderCosmos(); else renderSphere(view.sphere||"sph01"); intro(); });
document.getElementById("toggleHidden").addEventListener("click", e=>{ const on = e.currentTarget.getAttribute("aria-pressed")!=="true"; e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "Hidden layer: on" : "Hidden layer: off"; document.querySelector(".chart").classList.toggle("hidden-off", !on);
  if(!on){ const sel = selected && (sysById(selected) || (registry[selected] && registry[selected].parent)); const hid = s => s && (s.hidden || (s.parent && s.parent.hidden));
    if(view.level==="system" && sysById(view.id).hidden){ selected = null; renderSphere(); intro(); }
    else if(hid(sysById(selected)) || hid(registry[selected])){ selected = null; mark(null); intro(); } } });
document.getElementById("toggleCon").addEventListener("click", e=>{ const on = e.currentTarget.getAttribute("aria-pressed")!=="true"; e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "Constellations: on" : "Constellations: off"; document.querySelector(".chart").classList.toggle("con-off", !on); });
document.getElementById("toggleFig").addEventListener("click", e=>{ const on = e.currentTarget.getAttribute("aria-pressed")!=="true"; e.currentTarget.setAttribute("aria-pressed", on); e.currentTarget.textContent = on ? "Spell figure: on" : "Spell figure: off"; document.querySelector(".chart").classList.toggle("fig-off", !on); });
document.getElementById("toggleMode").addEventListener("click", e=>{
  FIG_MODE = FIG_MODE === "intended" ? "achieved" : "intended";
  e.currentTarget.textContent = FIG_MODE === "intended" ? "Figure: intended" : "Figure: achieved";
  const keep = view.level;
  if(keep === "cosmos") renderCosmos(); else if(keep === "sphere") renderSphere(view.sphere); else renderSystem(view.id);
});
const chips = document.getElementById("chips");
chips.innerHTML = DATA.unplaced.map(u=>`<button type="button" class="chip" data-chip="${u.id}">${esc(u.name)}</button>`).join("");
chips.addEventListener("click", e=>{ const c = e.target.closest(".chip"); if(!c) return; const u = DATA.unplaced.find(x=>x.id===c.dataset.chip); mark(u.id);
  panel.innerHTML = `<h2>${esc(u.name)}</h2><p class="kind">${esc(u.kind)}</p>${badges(["open"])}<p>${u.summary}</p>${u.draft?`<p class="hint">${u.draft}</p>`:""}`; if(innerWidth<980) panel.scrollIntoView({block:"start"}); });

renderCosmos(); intro();

</script>
</body>
</html>
