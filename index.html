<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caelestis</title>
<link rel="stylesheet" href="styles/caelestis.css">
<style>
  body { overflow: hidden; }
  body::before { display: none; }

  .gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }
  .gate-bg {
    position: absolute; inset: 0;
    background: url('https://lh3.googleusercontent.com/d/12jMujp5d1d3RehxqPDrtQiW33_iKM6_Q') center center / cover no-repeat;
    z-index: 0;
    transition: transform 0.9s ease, filter 0.9s ease;
  }
  .gate-bg::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(6,4,14,0.85) 0%, transparent 22%, transparent 48%, rgba(6,4,14,0.72) 78%, rgba(6,4,14,0.97) 100%),
      linear-gradient(to right,  rgba(6,4,14,0.7)  0%, transparent 22%, transparent 78%, rgba(6,4,14,0.7) 100%);
  }

  .gate-content {
    position: relative; z-index: 2;
    text-align: center; padding: 0 1.5rem;
    animation: fadeUp 1.2s ease both;
    transition: opacity 0.55s ease, transform 0.55s ease;
  }

  .gate-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(3rem, 8vw, 5.5rem);
    font-weight: 900; letter-spacing: 0.06em; line-height: 1;
    color: var(--text);
    text-shadow: 0 0 60px rgba(201,153,58,0.4), 0 2px 8px rgba(0,0,0,0.8);
    margin-bottom: 0.6rem;
  }
  .gate-title span { color: var(--gold-light); }
  .gate-tagline {
    font-size: clamp(1rem, 2.5vw, 1.3rem); font-style: italic;
    color: var(--text-dim); letter-spacing: 0.04em; margin-bottom: 0.5rem;
  }
  .gate-campaign {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 2rem;
  }
  .gate-rule {
    display: flex; align-items: center; justify-content: center;
    gap: 0.8rem; color: var(--gold-dim); margin-bottom: 2.8rem;
  }
  .gate-rule::before, .gate-rule::after {
    content: ''; width: 60px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold-dim));
  }
  .gate-rule::after { transform: scaleX(-1); }

  /* ── ENTER ── */
  .gate-enter {
    display: inline-flex; align-items: center; gap: 0.9rem;
    font-family: 'Cinzel', serif; font-size: 0.66rem;
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--gold); text-decoration: none;
    border: 1px solid var(--gold-dim);
    padding: 0.85rem 2.4rem;
    background: rgba(6,4,14,0.5);
    transition: border-color 0.25s, color 0.25s, background 0.25s, box-shadow 0.25s;
  }
  .gate-enter:hover, .gate:hover .gate-enter {
    border-color: var(--gold);
    color: var(--gold-light);
    background: rgba(201,153,58,0.08);
    box-shadow: 0 0 40px rgba(201,153,58,0.18);
  }
  .gate-enter svg { width: 12px; }

  .gate-hint {
    margin-top: 1.4rem;
    font-family: 'Cinzel', serif; font-size: 0.55rem;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--text-muted);
    animation: pulse 3s ease-in-out infinite;
  }

  /* ── TRANSITION OUT ── */
  body.entering .gate-content { opacity: 0; transform: translateY(-14px); }
  body.entering .gate-bg { transform: scale(1.06); filter: brightness(0.35); }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(22px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes pulse {
    0%,100% { opacity: 0.45; }
    50%     { opacity: 0.9; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gate-content, .gate-hint { animation: none; }
    .gate-bg, .gate-content { transition: none; }
  }
</style>
</head>
<body data-pagefind-filter="section:home">

<div class="gate" id="js-gate">
  <div class="gate-bg"></div>
  <div class="gate-content">
    <h1 class="gate-title">Cael<span>estis</span></h1>
    <p class="gate-tagline">Beyond the Astral Sea.</p>
    <p class="gate-campaign">A Spelljammer Campaign</p>
    <div class="gate-rule">✦</div>

    <a class="gate-enter" href="hub.html" id="js-enter">
      Enter
      <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 6h8M7 3l3 3-3 3"/></svg>
    </a>

    <div class="gate-hint">Click anywhere or press any key</div>
  </div>
</div>

<script>
(function () {
  var DEST = 'hub.html';
  var went = false;

  function enter() {
    if (went) return;
    went = true;
    document.body.classList.add('entering');
    setTimeout(function () { window.location.href = DEST; }, 380);
  }

  document.getElementById('js-gate').addEventListener('click', enter);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Shift' || e.key === 'Tab') return;
    enter();
  });

  var l = document.createElement('link');
  l.rel = 'prefetch'; l.href = DEST;
  document.head.appendChild(l);
})();
</script>
</body>
</html>
