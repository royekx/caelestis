name: Build site & deploy to Pages

# Runs on every push to main.
#
#   1. Transforms the raw tracker exports in data/raw/ into site-ready JSON.
#   2. Scaffolds any missing entity pages and injects current data into
#      existing ones.
#   3. Commits anything that changed, so the repo always reflects the tracker.
#   4. Builds three separate Pagefind indexes (player / DM / FIA).
#   5. Publishes the whole site to GitHub Pages.
#
# The raw exports are committed by n8n Workflow C via a pull request. Merging
# that PR is what kicks all of this off.
#
# ONE-TIME SETUP (do this once, in the repo on github.com):
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
# After that, every push to main runs this workflow automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:      # allows manual re-run from the Actions tab

permissions:
  contents: write         # needed to commit regenerated data and pages
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ── Data ────────────────────────────────────────────────────────────
      # Reads data/raw/*.json, drops DM-only rows and columns, groups the
      # session-tagged bullets by voyage, resolves links in both directions,
      # and writes data/*.json plus data/coverage.md.
      - name: Build site data from tracker exports
        run: node scripts/build-data.js

      # ── Pages ───────────────────────────────────────────────────────────
      # Scaffolds a page for any entity that does not have one yet, then
      # injects current data into every page carrying a data-entity binding.
      # Content outside [data-field] markers is never touched.
      - name: Build entity pages
        run: node scripts/build-pages.js

      # ── Commit ──────────────────────────────────────────────────────────
      # [skip ci] keeps this commit from triggering the workflow again.
      - name: Commit regenerated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data crew-manifest dossiers factions locations inventory quests
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Rebuild site data and pages [skip ci]"
            git push
          fi

      # ── Search indexes ──────────────────────────────────────────────────

      # -- Player index -> /pagefind/ --
      # Indexes only the player-facing directories via an explicit glob.
      # prime/, restricted/, wayfinder-path/, stellar-chart/, scripts/,
      # data/, styles/ and *-template.html are simply never matched.
      - name: Build player index
        run: |
          npx -y pagefind \
            --site . \
            --glob "{index.html,hub.html,voyages/*.html,logs/*.html,crew-manifest/**/*.html,dossiers/**/*.html,factions/**/*.html,locations/**/*.html,quests/**/*.html,spelljammer-nexus/**/*.html,inventory/**/*.html,handouts/**/*.html,navigation-records/**/*.html}" \
            --exclude-selectors "[data-pagefind-ignore], nav, .site-nav, footer" \
            --verbose

      # -- DM index -> /prime/pagefind/ --
      # Scoped by root: only prime/ is the site for this pass.
      - name: Build DM index
        run: |
          npx -y pagefind \
            --site prime \
            --glob "**/*.html" \
            --exclude-selectors "[data-pagefind-ignore], nav, .dm-nav, footer" \
            --verbose

      # -- FIA index -> /restricted/pagefind/ --
      - name: Build FIA index
        run: |
          npx -y pagefind \
            --site restricted \
            --glob "**/*.html" \
            --exclude-selectors "[data-pagefind-ignore], nav, footer" \
            --verbose

      # ── Publish (with all three index bundles) ──────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
