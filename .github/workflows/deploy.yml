name: Build search indexes & deploy to Pages

# Runs on every push to main. Builds three separate Pagefind indexes
# (player / DM / FIA) using the Pagefind binary directly, then publishes
# the whole site to GitHub Pages.
#
# ONE-TIME SETUP (do this once, in the repo on github.com):
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
# After that, every push to main runs this workflow automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:      # allows manual re-run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # -- Player index -> /pagefind/ --
      # Indexes only the player-facing directories via an explicit glob.
      # prime/, restricted/, wayfinder-path/, stellar-chart/, scripts/,
      # data/, styles/ and *-template.html are simply never matched.
      - name: Build player index
        run: |
          npx -y pagefind \
            --site . \
            --glob "{index.html,hub.html,voyages/*.html,bearings/*.html,logs/*.html,crew-manifest/**/*.html,dossiers/**/*.html,factions/**/*.html,quests/**/*.html,spelljammer-nexus/**/*.html,inventory/**/*.html,handouts/**/*.html,navigation-records/**/*.html}" \
            --exclude-selectors "[data-pagefind-ignore], nav, .site-nav, footer" \
            --verbose

      # -- DM index -> /prime/pagefind/ --
      # Scoped by root: only prime/ is the site for this pass.
      - name: Build DM index
        run: |
          npx -y pagefind \
            --site prime \
            --glob "**/*.html" \
            --exclude-selectors "[data-pagefind-ignore], nav, .dm-nav, footer" \
            --verbose

      # -- FIA index -> /restricted/pagefind/ --
      - name: Build FIA index
        run: |
          npx -y pagefind \
            --site restricted \
            --glob "**/*.html" \
            --exclude-selectors "[data-pagefind-ignore], nav, footer" \
            --verbose

      # -- Prune machine inputs from the published artifact --
      #
      # Pipeline contract (Workflow C -> this Action):
      #   data/raw/*.json  is the VERBATIM seven-tab tracker dump that n8n
      #                    commits. It is machine-written, regenerated on every
      #                    publish, and carries Visibility: DM rows as-is.
      #                    Never hand-edit it - the next sync overwrites it and
      #                    the repo silently drifts from the Sheet.
      #   data/*.json      is the PLAYER-SAFE output. scripts/transform.js is
      #                    the designated filter and drops Visibility: DM rows
      #                    from all seven builds.
      #
      # `path: .` below publishes the whole working tree, so the raw dump would
      # be fetchable by URL even though no page loads it and no Pagefind index
      # contains it. Filtering DM content is this Action's job, so the Action
      # removes the raw dump from the tree it is about to upload. The repo and
      # the n8n round-trip are untouched; only the published site loses it.
      - name: Prune machine inputs from the artifact
        run: |
          set -e
          rm -rf data/raw
          rm -f  scripts/transform.js scripts/build-data.js data/coverage.md
          find . -name '*-template.html' -not -path './.git/*' -delete
          # Fail the deploy rather than publish a DM row.
          if grep -rlq '"Visibility": *"DM"' --include='*.json' . ; then
            echo "::error::a published JSON still carries a Visibility: DM row"
            grep -rl '"Visibility": *"DM"' --include='*.json' .
            exit 1
          fi
          echo "pruned: data/raw/, transform.js, build-data.js, coverage.md, *-template.html"

      # -- Publish the whole site (with all three index bundles) --
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
