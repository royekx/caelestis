name: Build search indexes & deploy to Pages

# Runs on every push to main. Builds three separate Pagefind indexes
# (player / DM / FIA) using the Pagefind binary directly, then publishes
# the whole site to GitHub Pages.
#
# ONE-TIME SETUP (do this once, in the repo on github.com):
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
# After that, every push to main runs this workflow automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:      # allows manual re-run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # -- Player index -> /pagefind/ --
      # Indexes only the player-facing directories via an explicit glob.
      # prime/, restricted/, wayfinder-path/, stellar-chart/, scripts/,
      # data/, styles/ and *-template.html are simply never matched.
      - name: Build player index
        run: |
          npx -y pagefind \
            --site . \
            --glob "{index.html,hub.html,voyages/*.html,bearings/*.html,logs/*.html,crew-manifest/**/*.html,dossiers/**/*.html,factions/**/*.html,quests/**/*.html,spelljammer-nexus/**/*.html,inventory/**/*.html,handouts/**/*.html,navigation-records/**/*.html}" \
            --exclude-selectors "[data-pagefind-ignore], nav, .site-nav, footer" \
            --verbose

      # -- DM index -> /prime/pagefind/ --
      # Scoped by root: only prime/ is the site for this pass.
      - name: Build DM index
        run: |
          npx -y pagefind \
            --site prime \
            --glob "**/*.html" \
            --exclude-selectors "[data-pagefind-ignore], nav, .dm-nav, footer" \
            --verbose

      # -- FIA index -> /restricted/pagefind/ --
      - name: Build FIA index
        run: |
          npx -y pagefind \
            --site restricted \
            --glob "**/*.html" \
            --exclude-selectors "[data-pagefind-ignore], nav, footer" \
            --verbose

      # -- Prune build-only inputs from the published artifact --
      # path: . below publishes the whole working tree, so anything left here
      # is fetchable by URL even when it is absent from every Pagefind index.
      # data/raw/ is the UNFILTERED tracker export: it carries Visibility: DM
      # rows verbatim. transform.js and build-data.js have already consumed it
      # by this point, and no page loads it in the browser, so it is removed
      # from the tree before upload. The repo keeps its copy; only the artifact
      # loses it.
      - name: Prune build-only inputs
        run: |
          rm -rf data/raw
          rm -f  scripts/transform.js scripts/build-data.js
          rm -f  data/coverage.md
          find . -name '*-template.html' -not -path './.git/*' -delete
          echo "pruned from artifact:"; echo "  data/raw/, transform.js, build-data.js, coverage.md, *-template.html"

      # -- Publish the whole site (with all three index bundles) --
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
