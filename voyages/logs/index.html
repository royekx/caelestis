<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caelestis — Crew Logs</title>
<link rel="stylesheet" href="../../styles/caelestis.css">
<link rel="stylesheet" href="../../styles/register.css">
<style>
  /* ── The crew's shared document, framed ──
     One toolbar over the document: the tabs (when more than one document is
     linked), what is showing, and the three actions. The frame fills the
     space under the command bar. Google renders a pageless doc at a fixed
     text width, so the frame is capped near it rather than run full-bleed. */
  .log-shell { max-width: var(--frame-max, 1080px); margin: 0 auto; }
  .log-shell.railed > .tabrail { margin-bottom: 0.9rem; }
  .log-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 0.6rem 1rem; margin-bottom: 0.8rem;
  }
  .log-now { font-size: 0.98rem; color: var(--text-dim); }
  .log-now b { font-weight: 600; color: var(--text); }
  .log-age { margin-left: 0.5rem; font-style: italic; color: var(--text-muted); }
  .log-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .btn {
    font-family: 'Cinzel', serif; font-size: 0.76rem; letter-spacing: 0.12em; text-transform: uppercase;
    border: 1px solid var(--gold-rule); border-radius: 999px;
    color: var(--text-dim); background: transparent;
    padding: 0.42rem 0.95rem; text-decoration: none; cursor: pointer;
    transition: background .2s, border-color .2s, color .2s;
  }
  .btn:hover { border-color: var(--gold-dim); color: var(--gold-light); }
  .btn-primary { border-color: var(--gold-dim); color: var(--gold-light); background: var(--gold-faint); }
  .btn-primary:hover { border-color: var(--gold); }
  .btn.on { border-color: var(--gold-dim); color: var(--gold-light); background: var(--gold-faint); }
  .note-frame-wrap {
    position: relative; overflow: hidden;
    border: 1px solid var(--gold-rule); border-radius: 12px; background: var(--bg);
  }
  .frame-stage { position: relative; height: max(30rem, calc(100vh - var(--cb-h, 10rem) - 9rem)); }
  .note-frame {
    position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0;
    opacity: 0; transition: opacity .35s ease; pointer-events: none; z-index: 0;
  }
  .note-frame.ready { opacity: 1; }
  .note-frame.showing { pointer-events: auto; z-index: 1; }
  /* What shows while the document loads, instead of white. */
  .frame-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-muted); pointer-events: none; transition: opacity .3s ease;
  }
  .frame-loading.hidden { opacity: 0; }
  @media (max-width: 620px) {
    .frame-stage { height: 70vh; min-height: 26rem; }
    .log-actions { width: 100%; }
    .log-actions .btn-primary { margin-left: auto; }
    /* A phone keeps the two actions it needs on one row. */
    #noteAuto { display: none; }
  }
</style>
<script src="../../data/bearing.js" defer></script>
<script src="../../scripts/nav.js" defer></script>
</head>

<body data-pagefind-filter="section:logs">
<div class="page-content">
  <div class="page-header">
    <div class="page-emblem" data-pagefind-ignore>
      <svg viewBox="0 0 120 40" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <line x1="0" y1="20" x2="42" y2="20" stroke-width="0.6" opacity="0.4"/>
        <polyline points="38,15 43,20 38,25" opacity="0.5"/>
        <g transform="translate(60,20)">
          <path d="M-9,-11 L5,-11 L9,-7 L9,11 L-9,11 Z" opacity="0.9"/>
          <path d="M5,-11 L5,-7 L9,-7" opacity="0.5"/>
          <line x1="-5" y1="-4" x2="5" y2="-4" opacity="0.45"/>
          <line x1="-5" y1="0"  x2="5" y2="0"  opacity="0.45"/>
          <line x1="-5" y1="4"  x2="1" y2="4"  opacity="0.45"/>
        </g>
        <polyline points="82,15 77,20 82,25" opacity="0.5"/>
        <line x1="78" y1="20" x2="120" y2="20" stroke-width="0.6" opacity="0.4"/>
      </svg>
    </div>
    <div class="page-title" data-pagefind-meta="title">Crew Logs</div>
    <div class="page-subtitle">Working record of the crew. Written in transit, revised at berth.</div>
  </div>

  <div class="content">

    <p class="intro-note" data-pagefind-ignore>The crew's shared log. Anyone can write in it: <strong>Open to edit</strong> opens the document in a new tab, where it saves as you type. <strong>Refresh</strong> pulls in what someone else just wrote.</p>
    <!-- ── Documents ──────────────────────────────────────────────────────
         One button per document. A button whose data-doc is still a
         PASTE_ placeholder is left off the page; with one document linked,
         no tab row shows. To link a document:
           1. Create the Doc in Google Drive.
           2. Share -> General access -> "Anyone with the link", role "Editor".
           3. Put the doc ID (the long string between /d/ and /edit) in
              data-doc. Pasting the whole URL works too.
    ─────────────────────────────────────────────────────────────────── -->
    <div class="log-shell railed" data-pagefind-ignore>
      <div class="note-tabs tabrail">
        <button class="note-tab shared is-active" type="button" data-doc="1Uescsv7qK6h6baFNTpqcsCrjeSM_YwrLMdJKzocMirk">Crew Log</button>
        <button class="note-tab" type="button" data-doc="PASTE_BARTHOLOMEW_ID">Bartholomew</button>
        <button class="note-tab" type="button" data-doc="PASTE_BOOGIE_ID">Boogie</button>
        <button class="note-tab" type="button" data-doc="PASTE_CASEY_ID">Casey</button>
        <button class="note-tab" type="button" data-doc="PASTE_GREGORY_ID">Gregory</button>
        <button class="note-tab" type="button" data-doc="PASTE_SOL_ID">Sol</button>
        <button class="note-tab" type="button" data-doc="PASTE_TUMAK_ID">Tumak</button>
      </div>
      <div class="log-bar">
        <span class="log-now"><b id="noteLabel">Crew Log</b><span class="log-age" id="noteAge"></span></span>
        <span class="log-actions">
          <button class="btn" id="noteAuto" type="button" title="Reload the document every minute">Auto-refresh</button>
          <button class="btn" id="noteRefresh" type="button">Refresh</button>
          <a class="btn btn-primary" id="noteOpen" href="#" target="_blank" rel="noopener">Open to edit &rarr;</a>
        </span>
      </div>
      <div class="note-frame-wrap">
        <div class="frame-stage" id="frameStage">
          <div class="frame-loading hidden" id="frameLoading">Loading</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // A document not yet linked has no tab; one linked document needs no tab row.
  document.querySelectorAll('.note-tab').forEach(function (t) {
    var d = t.getAttribute('data-doc') || '';
    if (!d || d.indexOf('PASTE_') === 0) t.remove();
  });
  var tabs        = document.querySelectorAll('.note-tab');
  if (tabs.length < 2) document.querySelector('.note-tabs').hidden = true;
  var stage       = document.getElementById('frameStage');
  var loading     = document.getElementById('frameLoading');
  var label       = document.getElementById('noteLabel');
  var ageEl       = document.getElementById('noteAge');
  var openLink    = document.getElementById('noteOpen');
  var refreshBtn  = document.getElementById('noteRefresh');
  var autoBtn     = document.getElementById('noteAuto');

  var BASE    = 'https://docs.google.com/document/d/';
  var AUTO_MS = 60000;

  var frames  = {};   // docId -> { el: iframe, loadedAt: ms }
  var current = null;
  var timer   = null;
  var autoOn  = false;

  try { autoOn = window.localStorage.getItem('caelestis-note-auto') === '1'; } catch (e) {}

  function docId(raw) {
    var v = String(raw || '').trim();
    var m = v.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m) { return m[1]; }
    return v.replace(/^https?:\/\/[^/]+\//i, '').split('/')[0].split('?')[0];
  }

  // One iframe per document, created on first view and then kept alive.
  // Switching tabs hides and shows them, so scroll position survives.
  function frameFor(id) {
    if (frames[id]) { return frames[id]; }
    var el = document.createElement('iframe');
    el.className = 'note-frame';
    el.title = 'Crew logs';
    var rec = { el: el, loadedAt: 0 };
    el.addEventListener('load', function () {
      rec.loadedAt = Date.now();
      el.classList.add('ready');
      if (current === id) { loading.classList.add('hidden'); paintAge(); }
    });
    el.src = BASE + id + '/preview';
    stage.appendChild(el);
    frames[id] = rec;
    return rec;
  }

  function reload(id) {
    var rec = frames[id];
    if (!rec) { return; }
    rec.el.classList.remove('ready');
    if (current === id) { loading.classList.remove('hidden'); }
    rec.el.src = BASE + id + '/preview?t=' + Date.now();
  }

  function paintAge() {
    var rec = current && frames[current];
    if (!rec || !rec.loadedAt) { ageEl.textContent = ''; return; }
    var mins = Math.floor((Date.now() - rec.loadedAt) / 60000);
    ageEl.textContent = mins < 1 ? 'just loaded'
                      : 'loaded ' + mins + 'm ago';
  }
  setInterval(paintAge, 15000);

  function schedule() {
    if (timer) { clearInterval(timer); timer = null; }
    if (!autoOn) { return; }
    timer = setInterval(function () {
      if (current && !document.hidden) { reload(current); }
    }, AUTO_MS);
  }

  function setAuto(on) {
    autoOn = on;
    autoBtn.classList.toggle('on', on);
    autoBtn.textContent = on ? 'Auto-refresh \u00b7 on' : 'Auto-refresh';
    try { window.localStorage.setItem('caelestis-note-auto', on ? '1' : '0'); } catch (e) {}
    schedule();
  }

  function show(tab) {
    var raw  = tab.getAttribute('data-doc');
    var name = tab.textContent.trim();
    var isShared = tab.classList.contains('shared');

    tabs.forEach(function (t) { t.classList.remove('is-active'); t.setAttribute('aria-selected', 'false'); });
    tab.classList.add('is-active'); tab.setAttribute('aria-selected', 'true');
    label.textContent = name + (isShared ? '' : ' \u00b7 personal');

    Object.keys(frames).forEach(function (k) {
      frames[k].el.classList.remove('showing');
    });

    var id = docId(raw);
    current = id;
    openLink.href = BASE + id + '/edit';

    var rec = frameFor(id);
    rec.el.classList.add('showing');
    // Already loaded once? Show it as-is. No reload, no lost scroll position.
    loading.classList.toggle('hidden', !!rec.loadedAt);
    paintAge();
    schedule();
  }

  refreshBtn.addEventListener('click', function () {
    if (current) { reload(current); }
  });
  autoBtn.addEventListener('click', function () { setAuto(!autoOn); });

  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      show(tab);
      try { window.localStorage.setItem('caelestis-note-tab', tab.textContent.trim()); } catch (e) {}
    });
  });

  var last = null;
  try { last = window.localStorage.getItem('caelestis-note-tab'); } catch (e) {}
  var start = tabs[0];
  if (last) {
    tabs.forEach(function (tab) {
      if (tab.textContent.trim() === last) { start = tab; }
    });
  }

  setAuto(autoOn);
  show(start);
})();
</script>
</body>
</html>
