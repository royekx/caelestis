  <!-- The Watchers' emblem: a tall white spire with a curved, pointed crown and a
       sweeping base, rising out of cloud with two floating stones beside it. A channel
       of light runs up the shaft into the crown, where the blue-violet light glows, with
       two faint halos around it. Used as a CSS mask, so each page sets its colour:
       styles/dm.css (.emblem-mark.emblem-watchers on factions/watchers.html and
       dossiers/ezra.html); the Nexus page spelljammer-nexus/watchers.html inlines it. -->
