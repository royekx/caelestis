  <!-- The Fleet's device: the Erevos Galaxy seen from above, tilted about 20 degrees,
       its four spiral arms around a black hole and its thin ring, inside a double ring.
       One eight-pointed star on each arm marks one of the Fleet's four sectors; faint
       lines run from each star in to the centre. Generated from four arms a quarter turn
       apart. Used as a CSS mask, so each page sets its colour: the FIA seal
       (styles/fia.css, restricted/index.html) and the Fleet's device on the DM side
       (styles/dm.css, prime/factions/fleet.html). -->
